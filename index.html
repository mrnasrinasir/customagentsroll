usehold repair is done (aircon service, plumbing, electrical), capture: vendor, date, what was done, cost, warranty period, photos. Search by item or vendor when needed."},{"day":360,"name":"End-of-Year Letter Drafter","pillar":"AI enablement","category":"Writing","status":"Draft","tags":["creator","founder"],"tools":["Claude","Notion AI"],"description":"Drafts an end-of-year letter to share with the audience.","prompt":"Each December, draft an end-of-year letter from journal highlights, public wins, and reader signals. Warm, honest, with 3 lessons and 1 ask. UK English. Around 800 words."},{"day":361,"name":"Course Cohort Retro Synthesiser","pillar":"Analytics","category":"Learning","status":"Draft","tags":["consultant","creator"],"tools":["Google Sheets","Slack","Claude"],"description":"Synthesises a cohort retro from student feedback.","prompt":"End of each cohort, gather feedback (surveys + Slack quotes + completion rates). Synthesise: what worked, what fell flat, what to change, top 3 quotes for marketing. UK English, calm."},{"day":362,"name":"Personal CRM Birthday Card Sender","pillar":"Automation","category":"Family","status":"Draft","tags":["personal"],"tools":["Notion DB","WhatsApp","Gmail"],"description":"Sends a birthday card with one click after drafting.","prompt":"On contact birthdays, surface the drafted message (from earlier agent) and a one-click send option via WhatsApp/email. Log when sent. Never send automatically without approval."},{"day":363,"name":"Workspace Onboarding Guide","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["consultant","ops"],"tools":["Notion AI","Notion DB"],"description":"Generates a per-person onboarding tour of this Notion workspace.","prompt":"When a new person joins the workspace, generate a tailored onboarding tour: their teamspaces, the wiki, the agent library, the projects DB, key rituals. Walk them through over 5 sessions."},{"day":364,"name":"Year-in-Review Dashboard","pillar":"Analytics","category":"Learning","status":"Draft","tags":["personal","founder"],"tools":["Notion DB","Google Sheets","Claude"],"description":"Builds a year-in-review dashboard from all tracked DBs.","prompt":"Each December, build a year-in-review dashboard: books read, articles published, clients served, revenue, training sessions, family trips, daily habits stayed. One page, calm visuals."},{"day":365,"name":"Stale Agents Retirement Bot","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops"],"tools":["Notion DB","Claude"],"description":"Retires unused agents from this library quarterly.","prompt":"Quarterly, scan this 365 Custom Agents library. For agents with zero runs in 90 days and no scheduled use, suggest setting Status to 'Retired'. Never delete; archiving keeps the lesson learned."}]
</script>

<script>

(function(){
"use strict";

/* ── Load data ── */
let ALL_AGENTS;
try {
  const raw = document.getElementById("agents-data").textContent;
  ALL_AGENTS = JSON.parse(raw);
  if (!ALL_AGENTS || !ALL_AGENTS.length) throw new Error("empty");
} catch(e) {
  document.querySelector(".reel-container").innerHTML =
    '<div class="error-msg">No agents loaded — regenerate this file.</div>';
  document.getElementById("spinBtn").disabled = true;
  return;
}

/* ── State ── */
let lastWinnerIdx = -1;
let spinning = false;
let activePillars = new Set(["Automation","Analytics","AI enablement","Life"]);
let searchTerm = "";

function getFilteredAgents() {
  let agents = activePillars.size === 4 ? ALL_AGENTS : ALL_AGENTS.filter(a => activePillars.has(a.pillar));
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    agents = agents.filter(a =>
      (a.name && a.name.toLowerCase().includes(q)) ||
      (a.description && a.description.toLowerCase().includes(q)) ||
      (a.category && a.category.toLowerCase().includes(q))
    );
  }
  return agents;
}

/* ── Pillar filters ── */
document.querySelectorAll(".filter-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    if (spinning) return;
    const p = chip.dataset.pillar;
    const isActive = chip.dataset.active === "true";
    // Don't allow deactivating the last one
    if (isActive && activePillars.size === 1) return;
    chip.dataset.active = isActive ? "false" : "true";
    if (isActive) activePillars.delete(p); else activePillars.add(p);
    lastWinnerIdx = -1;
    populateReel();
  });
});

/* ── Search ── */
const searchInput = document.getElementById("searchInput");
const searchClear = document.getElementById("searchClear");
const noResults = document.getElementById("noResults");
const reelContainer = document.querySelector(".reel-container");

searchInput.addEventListener("input", () => {
  if (spinning) return;
  searchTerm = searchInput.value.trim();
  searchClear.classList.toggle("visible", searchInput.value.length > 0);
  lastWinnerIdx = -1;
  populateReel();
});

searchClear.addEventListener("click", () => {
  searchInput.value = "";
  searchTerm = "";
  searchClear.classList.remove("visible");
  lastWinnerIdx = -1;
  populateReel();
  searchInput.focus();
});

/* ── Reel ── */
const reelTrack = document.getElementById("reelTrack");
const ITEM_H_DESKTOP = 46;
const ITEM_H_MOBILE = 40;
function itemH() { return window.innerWidth <= 480 ? ITEM_H_MOBILE : ITEM_H_DESKTOP; }
let reelItems = [];
let idleDriftRAF = null;
let idleOffset = 0;

function populateReel() {
  const agents = getFilteredAgents();
  const empty = agents.length === 0;
  noResults.style.display = empty ? "block" : "none";
  reelContainer.style.display = empty ? "none" : "";
  spinBtn.disabled = empty;

  const h = itemH();
  // Create enough items to fill the reel several times for smooth animation
  reelTrack.innerHTML = "";
  reelItems = [];
  if (empty) { stopIdleDrift(); return; }
  const repeats = Math.max(3, Math.ceil(20 / agents.length));
  for (let r = 0; r < repeats; r++) {
    for (let i = 0; i < agents.length; i++) {
      const div = document.createElement("div");
      div.className = "reel-item";
      div.style.height = h + "px";
      div.textContent = agents[i].name;
      reelTrack.appendChild(div);
      reelItems.push(div);
    }
  }
  idleOffset = 0;
  startIdleDrift();
}

function startIdleDrift() {
  if (idleDriftRAF) cancelAnimationFrame(idleDriftRAF);
  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (prefersReducedMotion) return;
  const speed = 0.3; // px per frame
  function drift() {
    idleOffset -= speed;
    const totalH = reelItems.length * itemH();
    if (Math.abs(idleOffset) >= totalH / 3) idleOffset += totalH / 3;
    reelTrack.style.transform = `translateY(${idleOffset}px)`;
    idleDriftRAF = requestAnimationFrame(drift);
  }
  idleDriftRAF = requestAnimationFrame(drift);
}

function stopIdleDrift() {
  if (idleDriftRAF) { cancelAnimationFrame(idleDriftRAF); idleDriftRAF = null; }
}

/* ── Random ── */
function secureRandom(max) {
  if (window.crypto && crypto.getRandomValues) {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return arr[0] % max;
  }
  return Math.floor(Math.random() * max);
}

/* ── Spin ── */
const spinBtn = document.getElementById("spinBtn");
const resultCard = document.getElementById("resultCard");
const spinAgain = document.getElementById("spinAgain");

function spin() {
  if (spinning) return;
  const agents = getFilteredAgents();
  if (agents.length === 0) return;

  spinning = true;
  spinBtn.disabled = true;
  spinBtn.textContent = "Spinning…";
  resultCard.classList.remove("visible");

  // Pick winner (avoid repeat)
  let winIdx = secureRandom(agents.length);
  if (agents.length > 1 && winIdx === lastWinnerIdx) {
    winIdx = (winIdx + 1 + secureRandom(agents.length - 1)) % agents.length;
  }
  lastWinnerIdx = winIdx;
  const winner = agents[winIdx];

  stopIdleDrift();

  // Repopulate reel with filtered agents for spinning
  const h = itemH();
  reelTrack.innerHTML = "";
  // We need many copies to scroll through
  const totalSpinItems = agents.length * 6;
  for (let i = 0; i < totalSpinItems; i++) {
    const div = document.createElement("div");
    div.className = "reel-item";
    div.style.height = h + "px";
    div.textContent = agents[i % agents.length].name;
    reelTrack.appendChild(div);
  }

  // Calculate where winner lands (in the middle band)
  const containerH = document.querySelector(".reel-container").offsetHeight;
  const centerOffset = Math.floor(containerH / 2 / h);
  // Land on an instance of the winner far down the list
  const targetItemIndex = agents.length * 4 + winIdx;
  const targetY = -(targetItemIndex * h) + (centerOffset * h);
  const startY = 0;

  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DURATION = prefersReducedMotion ? 100 : 2500;

  reelTrack.style.transform = `translateY(${startY}px)`;
  const startTime = performance.now();

  function easeOutBack(t) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function animate(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / DURATION, 1);
    const eased = easeOutBack(progress);
    const currentY = startY + (targetY - startY) * eased;
    reelTrack.style.transform = `translateY(${currentY}px)`;

    // Add blur during fast part
    if (progress < 0.7 && !prefersReducedMotion) {
      reelTrack.style.filter = `blur(${Math.min(progress * 4, 2)}px)`;
    } else {
      reelTrack.style.filter = "none";
    }

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      reelTrack.style.filter = "none";
      onSpinComplete(winner);
    }
  }
  requestAnimationFrame(animate);
}

function onSpinComplete(agent) {
  spinning = false;
  spinBtn.disabled = false;
  spinBtn.textContent = "SPIN";
  showResult(agent);
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) burstConfetti();
}

/* ── Result card ── */
function pillarClass(p) {
  return "pillar-" + (p === "AI enablement" ? "ai-enablement" : p);
}

function showResult(a) {
  document.getElementById("rName").textContent = a.name;

  const chipsEl = document.getElementById("rChips");
  chipsEl.innerHTML = "";
  // Day badge (clickable to copy summary)
  const dayChip = document.createElement("span");
  dayChip.className = "chip day";
  dayChip.textContent = "Day " + (a.day || "?");
  dayChip.style.cursor = "pointer";
  dayChip.title = "Click to copy summary";
  dayChip.addEventListener("click", () => {
    const txt = `Day ${a.day} — ${a.name}: ${a.description}`;
    navigator.clipboard.writeText(txt).then(() => {
      dayChip.textContent = "Copied ✓";
      setTimeout(() => dayChip.textContent = "Day " + (a.day || "?"), 1500);
    });
  });
  chipsEl.appendChild(dayChip);

  if (a.pillar) {
    const c = document.createElement("span");
    c.className = "chip " + pillarClass(a.pillar);
    c.textContent = a.pillar;
    chipsEl.appendChild(c);
  }
  if (a.category) {
    const c = document.createElement("span");
    c.className = "chip";
    c.textContent = a.category;
    chipsEl.appendChild(c);
  }
  if (a.status) {
    const c = document.createElement("span");
    c.className = "chip status-" + a.status;
    c.textContent = a.status;
    chipsEl.appendChild(c);
  }

  document.getElementById("rDesc").textContent = a.description || "";

  // Tags
  const tagsEl = document.getElementById("rTags");
  const tagsLabel = document.getElementById("rTagsLabel");
  tagsEl.innerHTML = "";
  if (a.tags && a.tags.length) {
    tagsLabel.style.display = "";
    a.tags.forEach(t => {
      const c = document.createElement("span");
      c.className = "chip tag";
      c.textContent = t;
      tagsEl.appendChild(c);
    });
  } else { tagsLabel.style.display = "none"; }

  // Tools
  const toolsEl = document.getElementById("rTools");
  const toolsLabel = document.getElementById("rToolsLabel");
  toolsEl.innerHTML = "";
  if (a.tools && a.tools.length) {
    toolsLabel.style.display = "";
    a.tools.forEach(t => {
      const c = document.createElement("span");
      c.className = "chip tool";
      c.textContent = t;
      toolsEl.appendChild(c);
    });
  } else { toolsLabel.style.display = "none"; }

  // Prompt
  const promptToggle = document.getElementById("promptToggle");
  const promptSection = document.getElementById("promptSection");
  const promptArrow = document.getElementById("promptArrow");
  if (a.prompt) {
    promptToggle.style.display = "";
    document.getElementById("rPrompt").textContent = a.prompt;
    // Reset to collapsed
    promptSection.classList.remove("open");
    promptArrow.classList.remove("open");
    promptToggle.innerHTML = '<span class="arrow" id="promptArrow">▶</span> Show prompt';
  } else {
    promptToggle.style.display = "none";
    promptSection.classList.remove("open");
  }

  spinAgain.style.display = "";
  resultCard.classList.add("visible");
}

/* ── Prompt toggle ── */
document.getElementById("promptToggle").addEventListener("click", () => {
  const section = document.getElementById("promptSection");
  const isOpen = section.classList.contains("open");
  section.classList.toggle("open");
  const toggle = document.getElementById("promptToggle");
  toggle.innerHTML = `<span class="arrow ${isOpen ? "" : "open"}" id="promptArrow">▶</span> ${isOpen ? "Show" : "Hide"} prompt`;
});

/* ── Copy prompt ── */
document.getElementById("copyBtn").addEventListener("click", () => {
  const text = document.getElementById("rPrompt").textContent;
  const btn = document.getElementById("copyBtn");
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = "Copied ✓";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "Copy prompt"; btn.classList.remove("copied"); }, 1500);
  });
});

/* ── Spin triggers ── */
spinBtn.addEventListener("click", spin);
spinAgain.addEventListener("click", spin);
document.addEventListener("keydown", (e) => {
  if ((e.key === " " || e.key === "Enter") && !spinning &&
      document.activeElement === document.body) {
    e.preventDefault();
    spin();
  }
  // Allow Enter in the search input to trigger a spin
  if (e.key === "Enter" && document.activeElement === searchInput && !spinning) {
    e.preventDefault();
    spin();
  }
});

/* ── Confetti ── */
function burstConfetti() {
  const colors = ["var(--orange)","var(--blue)","var(--purple)","var(--green)","#ff6b9d","#ffd93d","#6bcb77"];
  const container = document.body;
  for (let i = 0; i < 30; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    const startX = 40 + Math.random() * 20; // % from left
    const drift = (Math.random() - 0.5) * 30;
    piece.style.left = startX + "%";
    piece.style.top = "30%";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.width = (5 + Math.random() * 6) + "px";
    piece.style.height = (5 + Math.random() * 6) + "px";
    piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
    piece.style.animationDuration = (1.2 + Math.random() * 1) + "s";
    piece.style.animationDelay = (Math.random() * 0.3) + "s";
    piece.style.setProperty("--drift", drift + "vw");
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 2500);
  }
}

/* ── Init ── */
populateReel();
})();

</script>
