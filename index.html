<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>365 Agents Roulette</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f13;--surface:#1a1a24;--surface2:#23233a;--border:#2e2e48;
  --text:#e8e8f0;--text-muted:#8888aa;--accent:#7c5cfc;--accent-hover:#9b7dff;
  --orange:#e8853d;--blue:#4a9eff;--purple:#9b6dff;--green:#44c97a;
  --chip-bg:rgba(255,255,255,0.06);--radius:12px;
  --font-stack:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
}
html{height:100%}
body{
  font-family:var(--font-stack);background:var(--bg);color:var(--text);
  min-height:100%;display:flex;flex-direction:column;align-items:center;
  padding:1.5rem 1rem;overflow-x:hidden;
}
a{color:var(--accent)}

/* ── Header ── */
.header{text-align:center;margin-bottom:1.5rem}
.header h1{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:800;letter-spacing:-.02em}
.header p{color:var(--text-muted);font-size:1rem;margin-top:.35rem}

/* ── Pillar filters ── */
.filters{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.25rem}
.filter-chip{
  padding:.35rem .85rem;border-radius:99px;font-size:.8rem;font-weight:600;
  cursor:pointer;border:2px solid transparent;transition:all .15s ease;
  user-select:none;-webkit-user-select:none;
}
.filter-chip[data-active="true"]{opacity:1}
.filter-chip[data-active="false"]{opacity:.35}
.filter-chip:hover{opacity:.85;transform:scale(1.05)}
.filter-chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filter-chip[data-pillar="Automation"]{background:var(--orange);color:#000}
.filter-chip[data-pillar="Analytics"]{background:var(--blue);color:#000}
.filter-chip[data-pillar="AI enablement"]{background:var(--purple);color:#fff}
.filter-chip[data-pillar="Life"]{background:var(--green);color:#000}

/* ── Search box ── */
.search-container{
  position:relative;width:min(400px,90vw);margin-bottom:1rem;
}
.search-input{
  width:100%;height:42px;padding:0 2.4rem 0 .85rem;
  border:1px solid var(--border);border-radius:99px;
  background:var(--surface);color:var(--text);
  font-family:var(--font-stack);font-size:.9rem;
  outline:none;transition:border-color .15s ease;
}
.search-input::placeholder{color:var(--text-muted)}
.search-input:focus{border-color:var(--accent)}
.search-clear{
  position:absolute;right:.55rem;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border:none;border-radius:50%;
  background:transparent;color:var(--text-muted);font-size:1rem;
  cursor:pointer;display:none;align-items:center;justify-content:center;
  line-height:1;transition:color .15s ease,background .15s ease;
}
.search-clear:hover{color:var(--text);background:rgba(255,255,255,0.08)}
.search-clear.visible{display:flex}
.no-results{
  width:min(400px,90vw);text-align:center;
  color:var(--text-muted);font-size:.9rem;
  padding:1rem 0;display:none;
}

/* ── Reel ── */
.reel-container{
  width:min(400px,90vw);height:230px;position:relative;
  background:var(--surface);border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--border);margin-bottom:1.5rem;
}
.reel-mask{
  position:absolute;inset:0;
  pointer-events:none;z-index:2;
  background:linear-gradient(to bottom,
    var(--bg) 0%,transparent 30%,transparent 70%,var(--bg) 100%);
}
.reel-highlight{
  position:absolute;top:50%;left:0;right:0;height:46px;
  transform:translateY(-50%);
  border-top:2px solid var(--accent);border-bottom:2px solid var(--accent);
  background:rgba(124,92,252,.08);
  pointer-events:none;z-index:1;
}
.reel-track{
  position:absolute;left:0;right:0;
  will-change:transform;
}
.reel-item{
  height:46px;display:flex;align-items:center;justify-content:center;
  font-size:1rem;font-weight:600;color:var(--text-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:0 1rem;
}

/* ── Spin button ── */
.spin-btn{
  width:min(320px,80vw);height:64px;border:none;border-radius:16px;
  background:linear-gradient(135deg,var(--accent),#5b3de8);
  color:#fff;font-size:1.35rem;font-weight:800;letter-spacing:.04em;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform .15s ease,box-shadow .15s ease;
  margin-bottom:2rem;
}
.spin-btn:hover:not(:disabled){transform:scale(1.04);box-shadow:0 8px 32px rgba(124,92,252,.35)}
.spin-btn:active:not(:disabled){transform:scale(.97)}
.spin-btn:disabled{opacity:.6;cursor:not-allowed}
.spin-btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* ── Result card ── */
.result-card{
  width:min(520px,95vw);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:1.5rem;
  opacity:0;transform:translateY(16px);
  transition:opacity .4s ease,transform .4s ease;
  margin-bottom:2rem;
}
.result-card.visible{opacity:1;transform:translateY(0)}
.result-card .agent-name{font-size:1.5rem;font-weight:800;margin-bottom:.75rem}
.result-card .chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.75rem}
.chip{
  display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:6px;
  font-size:.75rem;font-weight:600;background:var(--chip-bg);color:var(--text-muted);
}
.chip.day{background:var(--accent);color:#fff;font-weight:700}
.chip.pillar-Automation{background:rgba(232,133,61,.18);color:var(--orange)}
.chip.pillar-Analytics{background:rgba(74,158,255,.18);color:var(--blue)}
.chip.pillar-AI\ enablement,.chip.pillar-ai-enablement{background:rgba(155,109,255,.18);color:var(--purple)}
.chip.pillar-Life{background:rgba(68,201,122,.18);color:var(--green)}
.chip.status-Live{background:rgba(68,201,122,.18);color:var(--green)}
.chip.status-Draft{background:rgba(136,136,170,.15);color:var(--text-muted)}
.chip.status-Retired{background:rgba(170,136,100,.15);color:#aa8864}
.chip.tag,.chip.tool{background:rgba(255,255,255,0.04);color:var(--text-muted);font-weight:500}
.description{color:var(--text);line-height:1.55;margin-bottom:.75rem;font-size:.95rem}
.small-chips-label{font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem;margin-top:.5rem}

/* ── Prompt section ── */
.prompt-toggle{
  display:flex;align-items:center;gap:.5rem;
  background:none;border:1px solid var(--border);border-radius:8px;
  color:var(--text-muted);font-size:.85rem;padding:.45rem .8rem;
  cursor:pointer;margin-top:.75rem;transition:color .15s ease;
}
.prompt-toggle:hover{color:var(--text)}
.prompt-toggle .arrow{transition:transform .2s ease;font-size:.7rem}
.prompt-toggle .arrow.open{transform:rotate(90deg)}
.prompt-section{
  max-height:0;overflow:hidden;transition:max-height .35s ease;
  margin-top:.5rem;
}
.prompt-section.open{max-height:800px;overflow-y:auto}
.prompt-box{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:1rem;position:relative;
}
.prompt-text{
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  font-size:.8rem;line-height:1.6;color:var(--text-muted);
  white-space:pre-wrap;word-break:break-word;
  max-height:300px;overflow-y:auto;
}
.copy-btn{
  position:absolute;top:.6rem;right:.6rem;
  background:var(--accent);color:#fff;border:none;border-radius:6px;
  padding:.3rem .7rem;font-size:.75rem;font-weight:600;cursor:pointer;
  transition:background .15s ease;
}
.copy-btn:hover{background:var(--accent-hover)}
.copy-btn.copied{background:var(--green)}

/* ── Spin again ── */
.spin-again{
  background:none;border:1px solid var(--border);color:var(--text-muted);
  border-radius:8px;padding:.5rem 1.2rem;font-size:.85rem;cursor:pointer;
  margin-top:1rem;transition:all .15s ease;
}
.spin-again:hover{border-color:var(--accent);color:var(--text)}

/* ── Confetti ── */
.confetti-piece{
  position:fixed;width:8px;height:8px;border-radius:2px;
  pointer-events:none;z-index:999;
  animation:confetti-fall 1.8s cubic-bezier(.25,.46,.45,.94) forwards;
}
@keyframes confetti-fall{
  0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1)}
  100%{opacity:0;transform:translate(var(--drift,0),60vh) rotate(720deg) scale(.3)}
}

/* ── Footer ── */
.footer{
  margin-top:auto;padding-top:2rem;text-align:center;
  color:var(--text-muted);font-size:.75rem;line-height:1.6;
}
.footer a{color:var(--text-muted);text-decoration:underline;}
.footer a:hover{color:var(--text);}

/* ── Error state ── */
.error-msg{
  background:#3a1a1a;border:1px solid #5a2a2a;border-radius:var(--radius);
  padding:2rem;text-align:center;color:#ff6b6b;max-width:400px;
}

/* ── Reduced motion ── */
@media(prefers-reduced-motion:reduce){
  .reel-track,.result-card,.confetti-piece{animation:none!important;transition:none!important}
  .result-card.visible{opacity:1;transform:none}
}

/* ── Mobile tweaks ── */
@media(max-width:480px){
  body{padding:1rem .5rem}
  .reel-container{height:200px}
  .reel-item{font-size:.9rem;height:40px}
  .reel-highlight{height:40px}
  .spin-btn{height:56px;font-size:1.15rem}
  .result-card{padding:1rem}
  .result-card .agent-name{font-size:1.2rem}
}
</style>
</head>
<body>

<header class="header">
  <h1>🎰 365 Agents Roulette</h1>
  <p>Spin to find your next agent</p>
</header>

<div class="filters" role="group" aria-label="Filter by pillar">
  <button class="filter-chip" data-pillar="Automation" data-active="true" tabindex="0">🟠 Automation</button>
  <button class="filter-chip" data-pillar="Analytics" data-active="true" tabindex="0">🔵 Analytics</button>
  <button class="filter-chip" data-pillar="AI enablement" data-active="true" tabindex="0">🟣 AI enablement</button>
  <button class="filter-chip" data-pillar="Life" data-active="true" tabindex="0">🟢 Life</button>
</div>

<div class="search-container">
  <input type="text" class="search-input" id="searchInput" placeholder="Search agents by name, description, or category…" aria-label="Search agents">
  <button class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
</div>

<div class="no-results" id="noResults">No matching agents found</div>

<div class="reel-container" aria-hidden="true">
  <div class="reel-mask"></div>
  <div class="reel-highlight"></div>
  <div class="reel-track" id="reelTrack"></div>
</div>

<button class="spin-btn" id="spinBtn">SPIN</button>

<div class="result-card" id="resultCard" aria-live="polite">
  <div class="agent-name" id="rName"></div>
  <div class="chips" id="rChips"></div>
  <div class="description" id="rDesc"></div>
  <div class="small-chips-label" id="rTagsLabel" style="display:none">Tags</div>
  <div class="chips" id="rTags"></div>
  <div class="small-chips-label" id="rToolsLabel" style="display:none">Tools used</div>
  <div class="chips" id="rTools"></div>
  <button class="prompt-toggle" id="promptToggle" style="display:none">
    <span class="arrow" id="promptArrow">▶</span> Show prompt
  </button>
  <div class="prompt-section" id="promptSection">
    <div class="prompt-box">
      <button class="copy-btn" id="copyBtn">Copy prompt</button>
      <div class="prompt-text" id="rPrompt"></div>
    </div>
  </div>
  <button class="spin-again" id="spinAgain" style="display:none">🎲 Spin again</button>
</div>

<footer class="footer">
  <div>365 agents loaded · Data as of 2026-06-11</div>
  <div>Built by <a href="https://nasrinasir.com" target="_blank" rel="noopener noreferrer">Nasri</a></div>
</footer>

te it with: Role, Inputs, Steps, Constraints, Output format. Keep it under 250 words. Default to UK English. Flag anything ambiguous as an open question at the bottom."},{"day":18,"name":"Meal Planner","pillar":"Life","category":"Household","status":"Draft","tags":["parent","personal"],"tools":["Notion AI"],"description":"Builds a 5-day family meal plan with one shared grocery list.","prompt":"Plan 5 dinners for a family of 3, halal, balanced, mostly home-cooked, with one easy night and one new recipe. Output: a day-by-day menu and a deduped grocery list grouped by aisle. Respect any dislikes I list."},{"day":19,"name":"Client Onboarding Welcome Pack","pillar":"Automation","category":"Client Ops","status":"Draft","tags":["consultant","ops"],"tools":["Zapier","Notion AI","Notion DB"],"description":"Generates a personalised welcome page when a deal moves to Closed-Won.","prompt":"When a CRM deal flips to Closed-Won, generate a welcome page with: greeting, sprint plan, runbook links, calendar booking link, and a 5-question kick-off form. Tailor the greeting using the client's industry and engagement scope."},{"day":20,"name":"Content Performance Dashboard","pillar":"Analytics","category":"Content","status":"Draft","tags":["creator"],"tools":["Notion AI","Notion DB","Google Sheets"],"description":"Weekly view of top content by views, saves, and reach across channels.","prompt":"Each Sunday, aggregate last week's content performance across LinkedIn, X, and the newsletter. Report top 5 pieces by saves and reach, lowest performer with a hypothesis, and one experiment to try next week."},{"day":21,"name":"1:1 Session Recap Writer","pillar":"AI enablement","category":"Client Ops","status":"Draft","tags":["consultant"],"tools":["Notion AI","Gmail"],"description":"Turns a 1:1 Notion Expert Session transcript into a client recap email.","prompt":"Given a 1:1 session transcript or AI notes, write a recap email: warm opener, top 3 takeaways, action items with owners, links to any resources mentioned, and an invitation to book the next session. UK English, under 220 words."},{"day":22,"name":"Sleep Wind-down Coach","pillar":"Life","category":"Health","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion Calendar"],"description":"Guides a 20-minute wind-down routine based on tomorrow's load.","prompt":"Each evening at 21:30, look at tomorrow's calendar. If it's heavy, recommend an earlier wind-down. Output a 20-minute routine: lights, screens off time, du'a, light reading suggestion, and target sleep time."},{"day":23,"name":"Slack to Notion Logger","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops"],"tools":["Slack","Zapier","Notion DB"],"description":"Captures starred Slack messages into a Notion 'snippets' database.","prompt":"When a Slack message is starred or :bookmark: reacted, capture sender, channel, timestamp, and message text into the Snippets DB. Tag by channel. Skip if duplicate within 7 days."},{"day":24,"name":"Source to Story Theme Finder","pillar":"AI enablement","category":"Research","status":"Draft","tags":["journalist","creator"],"tools":["Notion AI","Notion DB"],"description":"Clusters captured sources into recurring themes for the writing pipeline.","prompt":"Read all sources tagged 'New' in the Sources DB. Cluster into 3-5 themes. For each theme produce: a one-line description, the strongest quote, and 2 article angles a journalist or creator could write. Set Stage = Themed."},{"day":25,"name":"Monthly Cashflow Reporter","pillar":"Analytics","category":"Finance","status":"Draft","tags":["founder","ops"],"tools":["Notion AI","Notion DB","Google Sheets"],"description":"End-of-month cashflow with category breakdown and runway estimate.","prompt":"On the last day of each month, summarise inflows by client and outflows by category. Compare against the previous 3 months. Output: a one-page report and a runway estimate based on average burn."},{"day":26,"name":"Daily Standup Compiler","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops","consultant"],"tools":["Notion AI","Notion DB"],"description":"Compiles yesterday's done, today's plan, and blockers from Notion tasks.","prompt":"Each morning, pull tasks completed yesterday and tasks due today from the Tasks DB. Detect blockers from comments. Output a 5-line standup: Done, Doing, Next, Blockers, and one focus theme."},{"day":27,"name":"Grateful Three","pillar":"Life","category":"Family","status":"Draft","tags":["personal","parent"],"tools":["Notion AI","Notion DB"],"description":"Asks for three things to be grateful for each evening and logs them.","prompt":"At 21:00, prompt for three small things to be grateful for today. Save to the Gratitude DB with date and short tags. On Sundays, surface the previous week's entries as a short reflection."},{"day":28,"name":"Proposal Drafter","pillar":"AI enablement","category":"Client Ops","status":"Draft","tags":["consultant"],"tools":["Notion AI","Claude"],"description":"Drafts a fixed-fee proposal from a Discovery Call note.","prompt":"Given a Discovery Call note, draft a fixed-fee proposal in work.flowers voice: Problem, Outcome, Sprint plan (Discover/Design/Build/Hand off), Investment, Inclusions, Out of scope, Next step. UK English, plainspoken."},{"day":29,"name":"Calendar Conflict Resolver","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops"],"tools":["Notion Calendar","Zapier","Notion AI"],"description":"Detects double-bookings and proposes the least disruptive move.","prompt":"Scan tomorrow's calendar for conflicts. For each, identify the higher-priority event and propose 2 alternate slots for the other, weighted by attendee count and external vs internal. Send a draft reschedule message."},{"day":30,"name":"Reading Notes Distiller","pillar":"AI enablement","category":"Learning","status":"Draft","tags":["personal","creator"],"tools":["Notion AI","Claude"],"description":"Turns book highlights into a one-pager with key ideas and one experiment.","prompt":"Given Kindle/BookFusion highlights, produce a one-pager: 5 key ideas with one supporting quote each, contradictions noticed, and one experiment to run this week."},{"day":31,"name":"Lead Scorecard Dashboard","pillar":"Analytics","category":"CRM","status":"Draft","tags":["ops","founder"],"tools":["Notion AI","Notion DB"],"description":"Scores active leads by fit, intent, and engagement.","prompt":"Score each active lead 0-100 using Fit (ICP match), Intent (recent actions), Engagement (replies, opens). Output a table sorted high-to-low with top 5 next actions. Refresh weekly."},{"day":32,"name":"WhatsApp Lead Reply Drafter","pillar":"Automation","category":"CRM","status":"Draft","tags":["solo-coach","consultant"],"tools":["Claude","Zapier","WhatsApp"],"description":"Drafts a personalised first reply for an inbound WhatsApp lead.","prompt":"Given a new WhatsApp lead's profile and message, draft a 2-3 sentence reply in friendly UK English. Reference their context if known. Ask one clarifying question. Never promise outcomes; offer a free 30-min scoping call."},{"day":33,"name":"Hadith of the Day","pillar":"Life","category":"Faith","status":"Draft","tags":["personal"],"tools":["Notion AI"],"description":"Shares one short hadith with translation, source, and a practical lesson.","prompt":"Each day, share one short authentic hadith: Arabic if available, UK English translation, source (collection + number), and a single practical lesson for modern life. Avoid weak or disputed narrations."},{"day":34,"name":"SOC 2 Evidence Chaser","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops","consultant"],"tools":["Zapier","Slack","Notion DB"],"description":"Detects missing controls in Vanta and drafts requests to owners.","prompt":"Each week, check Vanta for controls failing or missing evidence. For each, identify the owner and draft a Slack DM with the control name, what's needed, and a 5-day deadline. Track in a Compliance Tasks DB."},{"day":35,"name":"Workshop Recap Synthesiser","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator","consultant"],"tools":["Notion AI","Claude"],"description":"Turns a workshop transcript into a recap page, key quotes, and follow-up tasks.","prompt":"Given a workshop transcript, produce: a 6-line summary, top 3 themes with supporting quotes, photo placeholders, 5 follow-up tasks for the facilitator, and a thank-you note for attendees."},{"day":36,"name":"Kid's Activity Generator","pillar":"Life","category":"Family","status":"Draft","tags":["parent"],"tools":["Notion AI"],"description":"Suggests one age-appropriate activity for the child given weather and time.","prompt":"Ask child's age, available time, and indoor/outdoor preference. Suggest one activity with materials, steps, and an open-ended question to ask the child afterwards. Avoid screen time."},{"day":37,"name":"Reading List Curator","pillar":"AI enablement","category":"Learning","status":"Draft","tags":["personal","creator"],"tools":["Notion AI","Claude"],"description":"Recommends 3 reads per month aligned to current goals.","prompt":"On the 1st of each month, ask for the top theme I'm exploring. Suggest 3 reads (1 book, 1 essay, 1 podcast), why each is relevant, and what I should pay attention to. Add to the BookFusion DB."},{"day":38,"name":"KPI Watcher","pillar":"Analytics","category":"Admin","status":"Draft","tags":["founder","ops"],"tools":["Notion DB","Slack","Zapier"],"description":"Watches a set of KPIs and alerts when any deviate beyond threshold.","prompt":"Track these KPIs daily: revenue, new leads, active clients, content reach, inbox SLA. Alert in Slack when any deviates more than 20 percent from the rolling 7-day average. Include the metric, value, delta, and a hypothesis."},{"day":39,"name":"Form-to-Database Router","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops"],"tools":["Zapier","Notion DB","Slack"],"description":"Routes a new form submission to the right Notion DB with cleaned fields.","prompt":"When a Tally/Notion form is submitted, route the row to the right DB based on the 'type' field. Normalise phone numbers, lowercase emails, trim whitespace. Notify the owner in Slack if the form is high-priority."},{"day":40,"name":"Tweet Variants Generator","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator"],"tools":["Notion AI","Claude"],"description":"Generates 5 tweet variants from a single insight, plus one thread version.","prompt":"Given an insight, write 5 standalone tweet variants (under 270 chars) and one 4-tweet thread expanding the strongest variant. Voice: warm, plainspoken, UK English, no hashtags. No engagement bait."},{"day":41,"name":"Hydration & Movement Nudger","pillar":"Life","category":"Health","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion Calendar"],"description":"Gentle nudges throughout the day for water and stretching.","prompt":"Send 3 nudges between 09:00 and 17:00: water check at 10:00, stretch at 13:00, walk at 15:30. Skip if a meeting is on. Keep messages short, kind, and never guilt-inducing."},{"day":42,"name":"PR / Press Mention Tracker","pillar":"Automation","category":"Content","status":"Draft","tags":["creator","founder"],"tools":["Zapier","Claude","Notion DB"],"description":"Watches for mentions of Nasri, work.flowers, or client names across the web.","prompt":"Each morning, search the web for new mentions of: 'Nasri Nasir', 'work.flowers', and active client names. Log new mentions to the PR DB with source, date, sentiment guess, and a one-line summary."},{"day":43,"name":"Quarterly Review Builder","pillar":"Analytics","category":"Admin","status":"Draft","tags":["founder","personal"],"tools":["Notion AI","Notion DB"],"description":"Compiles a quarterly review with wins, losses, and the next quarter's theme.","prompt":"At quarter end, pull goals, KPIs, client deliverables and personal milestones. Output a review with: 5 wins, 3 losses with lessons, top blockers, and a proposed theme + 3 goals for next quarter."},{"day":44,"name":"Date Night Planner","pillar":"Life","category":"Family","status":"Draft","tags":["personal","parent"],"tools":["Notion AI","Claude"],"description":"Plans a low-key date night within a chosen budget and area.","prompt":"Plan a 3-hour date night for two in Singapore. Ask for budget, area, and food preference. Suggest one main activity, one food spot, and one quiet wind-down. Include opening hours and a backup plan."},{"day":45,"name":"Discovery Call Pre-brief","pillar":"AI enablement","category":"Client Ops","status":"Draft","tags":["consultant"],"tools":["Notion AI","Claude","Notion Calendar"],"description":"Briefs Nasri 30 minutes before a discovery call with prospect context.","prompt":"30 minutes before a Discovery Call, send a brief: prospect name, company, industry, likely jobs-to-be-done, 3 ROI-ranked questions to ask, and a relevant case story to reference. Keep under 150 words."},{"day":46,"name":"New Subscriber Welcome","pillar":"Automation","category":"Content","status":"Draft","tags":["creator"],"tools":["Zapier","Gmail"],"description":"Sends a 3-email welcome sequence over 7 days to new newsletter subscribers.","prompt":"When a new subscriber joins, send: Day 0 welcome with a top resource, Day 3 a behind-the-scenes story, Day 7 an invite to reply with their biggest workflow challenge. UK English, calm tone."},{"day":47,"name":"Weekly Calendar Briefer","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["consultant","personal"],"tools":["Notion AI","Notion Calendar"],"description":"Briefs the week ahead with themes, prep needs, and risk areas.","prompt":"Each Sunday evening, summarise the week ahead: total meeting hours, deep-work blocks, prep needed before each meeting, and risk flags (back-to-backs, late nights). Suggest one block to defend or move."},{"day":48,"name":"Personal Budget Reviewer","pillar":"Life","category":"Finance","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion DB"],"description":"Monthly review of personal spending against budget categories.","prompt":"Each month-end, summarise personal spending by category vs budget. Flag overspends and underspends. Suggest one small habit change for next month and one fixed cost to renegotiate."},{"day":49,"name":"Database Schema Critic","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["consultant","ops"],"tools":["Notion AI","Notion DB"],"description":"Reviews a Notion database schema and suggests simplifications.","prompt":"Given a Notion DB schema, critique it: redundant properties, unclear names, over-use of select where status fits, missing relations. Suggest a leaner version with rationale. Recommend at most 3 changes per pass."},{"day":50,"name":"NPS / CSAT Aggregator","pillar":"Analytics","category":"Client Ops","status":"Draft","tags":["consultant","founder"],"tools":["Notion AI","Notion DB","Google Sheets"],"description":"Aggregates client feedback into an NPS dashboard with verbatim themes.","prompt":"Aggregate feedback survey results monthly. Compute NPS and CSAT. Cluster verbatim comments into 3-5 themes (Positive / Improve / Surprise). Surface 2 verbatim quotes per theme."},{"day":51,"name":"Voice Memo to Notion","pillar":"Automation","category":"Admin","status":"Draft","tags":["personal","ops"],"tools":["Claude","Zapier","Notion DB"],"description":"Transcribes a voice memo and files it as a structured note.","prompt":"When a voice memo is uploaded, transcribe in UK English, identify type (idea, task, journal, meeting), extract action items, and file in the right DB. Keep the original transcript at the bottom."},{"day":52,"name":"Bedtime Story Generator","pillar":"Life","category":"Family","status":"Draft","tags":["parent"],"tools":["Notion AI","Claude"],"description":"Generates a 4-minute bedtime story for a child, on a chosen theme.","prompt":"Ask child's age and a theme. Write a 4-minute (~600 word) bedtime story in UK English with a kind protagonist, a small problem, a quiet resolution, and a gentle final sentence. Halal-friendly imagery."},{"day":53,"name":"Cold Email Personaliser","pillar":"Automation","category":"CRM","status":"Draft","tags":["consultant","founder"],"tools":["Claude","Zapier"],"description":"Generates a personalised opener for an outbound cold email.","prompt":"Given a target's LinkedIn URL and a generic email body, produce a personalised first line (under 25 words) referencing something specific from their last 60 days of activity. Never fabricate; if no signal, return null."},{"day":54,"name":"Jumu'ah Reminder & Reflection","pillar":"Life","category":"Faith","status":"Draft","tags":["personal"],"tools":["Notion AI","WhatsApp"],"description":"Friday reminder with one reflection prompt before Jumu'ah.","prompt":"Each Friday at 11:00, send a gentle reminder for Jumu'ah, including local prayer time and one reflection prompt drawn from the surah typically recited (Al-Kahf). Keep tone calm and unhurried."},{"day":55,"name":"Article Outline Brainstormer","pillar":"AI enablement","category":"Writing","status":"Draft","tags":["creator","journalist"],"tools":["Notion AI","Claude"],"description":"Generates 3 outline options for a given article angle.","prompt":"Given an angle, produce 3 outline options (How-to, Story, Argument). Each outline has H2 headings, key claims, and a target audience. Recommend the strongest with rationale."},{"day":56,"name":"Subscription Audit Bot","pillar":"Automation","category":"Finance","status":"Draft","tags":["personal","founder"],"tools":["Claude","Notion DB"],"description":"Surfaces all active subscriptions and flags duplicates or unused ones.","prompt":"Each quarter, list all active SaaS and personal subscriptions from bank/credit card statements. Flag duplicates (e.g. two cloud storage tools) and any with no login activity in 60 days. Suggest cancel/keep/downgrade."},{"day":57,"name":"Funnel Conversion Reporter","pillar":"Analytics","category":"CRM","status":"Draft","tags":["founder","ops"],"tools":["Notion DB","Google Sheets"],"description":"Reports conversion rate from each marketing funnel stage.","prompt":"Each week, compute conversion rate at each funnel stage: visit > subscribe > book call > proposal > close. Highlight the biggest drop. Suggest one experiment with hypothesis and metric."},{"day":58,"name":"Holiday Itinerary Planner","pillar":"Life","category":"Family","status":"Draft","tags":["parent","personal"],"tools":["Notion AI","Claude"],"description":"Drafts a family holiday itinerary with halal food spots and rest blocks.","prompt":"Given destination, dates, and travelers, draft a daily itinerary. Cluster activities by area, include halal food options, prayer time considerations, kid-friendly buffers, and rest days every 3 days."},{"day":59,"name":"Newsroom Triage Lite","pillar":"Automation","category":"Inbox","status":"Draft","tags":["journalist"],"tools":["Claude","Notion AI"],"description":"Sorts incoming source pitches into Story / Maybe / Pass with rationale.","prompt":"For each incoming pitch (email or DM), classify into Story, Maybe, or Pass. Use criteria: novelty, source credibility, audience fit. Output a one-line reason and a suggested next action."},{"day":60,"name":"Personal Knowledge Reviewer","pillar":"AI enablement","category":"Learning","status":"Draft","tags":["personal","creator"],"tools":["Notion AI","Notion DB"],"description":"Resurfaces 5 random notes from the second brain each week.","prompt":"Each Saturday, surface 5 random notes from the Second Brain DB tagged 'evergreen'. For each, suggest a follow-up: keep, refine, archive, or expand into a draft."},{"day":61,"name":"Project Status Auto-Drafter","pillar":"Automation","category":"Client Ops","status":"Draft","tags":["consultant","ops"],"tools":["Notion AI","Notion DB"],"description":"Drafts a weekly client-facing project status update.","prompt":"Each Friday, for each active client project, draft a status update: progress, what's next, blockers, and a 'need from you' note. Keep under 120 words per client. UK English."},{"day":62,"name":"Habit Streak Tracker","pillar":"Life","category":"Health","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion DB"],"description":"Tracks daily habits and gently surfaces the longest streaks.","prompt":"Each evening, ask which of the tracked habits I completed today (salah, walk, no late-night sugar, read 10 min). Save and report the streak. Celebrate calmly; never shame a miss."},{"day":63,"name":"Tone Polisher (UK English)","pillar":"AI enablement","category":"Writing","status":"Draft","tags":["creator","consultant"],"tools":["Notion AI","Claude"],"description":"Polishes any draft into Nasri's warm, plainspoken UK English voice.","prompt":"Rewrite the provided text in Nasri's voice: UK English, warm, plainspoken, no jargon, no hype. Preserve meaning. Keep length within 10 percent. Flag anything you remove for vagueness."},{"day":64,"name":"Weekly Win Highlighter","pillar":"Analytics","category":"Admin","status":"Draft","tags":["personal","founder"],"tools":["Notion AI","Notion DB","GitHub"],"description":"Surfaces 3 wins per week from across systems.","prompt":"Each Friday, scan the Tasks DB (completed), CRM (closed-won), Content (published), and any commit/PR activity. Surface 3 wins worth celebrating with one line each."},{"day":65,"name":"Recipe Buddy","pillar":"Life","category":"Household","status":"Draft","tags":["parent","personal"],"tools":["Notion AI","Claude"],"description":"Suggests a recipe based on ingredients on hand and dietary needs.","prompt":"Ask which ingredients are on hand and any dietary needs (halal default). Suggest 2 recipes with prep time under 30 min, step-by-step instructions, and a substitution table for missing items."},{"day":66,"name":"Client Bug Triage","pillar":"Automation","category":"Client Ops","status":"Draft","tags":["ops","consultant"],"tools":["Linear","Zapier","Slack"],"description":"Triages incoming client bug reports and assigns urgency.","prompt":"When a bug report arrives (email, Slack, Linear), classify severity (SEV1-4), affected feature, and reproduction steps. Create a Linear issue. SEV1 pings on-call immediately; SEV2 within 2 hours."},{"day":67,"name":"Notion Workspace Auditor","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["ops","consultant"],"tools":["Notion AI","Notion DB"],"description":"Audits the workspace for stale pages, orphan DBs, and over-shared links.","prompt":"Quarterly, scan the workspace: pages not edited in 180 days, orphan databases, publicly shared pages, and large duplicate clusters. Output an audit report with archive/keep/share-fix suggestions."},{"day":68,"name":"Daily Du'a Picker","pillar":"Life","category":"Faith","status":"Draft","tags":["personal"],"tools":["Notion AI"],"description":"Picks the right du'a for the day's context (travel, exam, gratitude, distress).","prompt":"Ask what kind of day it is (travel, work, family, hard day, joy). Pick one matching authentic du'a with Arabic, transliteration, UK English meaning, and a brief note on when the Prophet (PBUH) used it."},{"day":69,"name":"SOP Drafter","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["consultant","ops"],"tools":["Notion AI","Claude"],"description":"Drafts a Standard Operating Procedure for a repeatable process.","prompt":"Given a process description, draft an SOP with: Purpose, Trigger, Inputs, Steps (numbered), Owner, Done definition, Edge cases. UK English. Keep under 600 words. Suggest where in Notion it belongs."},{"day":70,"name":"Time-blocked Day Planner","pillar":"Life","category":"Admin","status":"Draft","tags":["personal","consultant"],"tools":["Notion AI","Notion Calendar"],"description":"Drafts a time-blocked day plan based on tasks and energy.","prompt":"Each morning, draft a time-blocked plan: morning deep work block, admin window, lunch + walk, client time, evening wind-down. Limit to 4 hours of meetings. Defend at least one 90-min focus block."},{"day":71,"name":"Renewal Reminder Bot","pillar":"Automation","category":"Client Ops","status":"Draft","tags":["consultant","founder"],"tools":["Zapier","Slack","Notion DB"],"description":"Reminds 60 days before any client retainer renews.","prompt":"For each active retainer, check end date. 60 days out, draft a renewal conversation note: scope review, results delivered, proposed next term. Notify Nasri in Slack and create a Task."},{"day":72,"name":"Channel Health Dashboard","pillar":"Analytics","category":"Content","status":"Draft","tags":["creator"],"tools":["Notion DB","Google Sheets"],"description":"Tracks LinkedIn, X, and newsletter health over rolling 28 days.","prompt":"Compute per-channel: post count, total reach, avg engagement rate, top post, follower delta. Compare rolling 28d vs prior 28d. Show as one combined dashboard with a 2-line headline."},{"day":73,"name":"One-on-One Prep Briefer","pillar":"AI enablement","category":"Client Ops","status":"Draft","tags":["consultant"],"tools":["Notion AI","Slack","Notion DB"],"description":"Builds a one-on-one prep doc using recent shared context.","prompt":"Given the person and meeting time, build a prep doc: last meeting recap, open commitments to/from each side, recent shared work, 3 ROI-ranked questions, one personal check-in. Keep under 200 words."},{"day":74,"name":"Gold & FX Watcher","pillar":"Analytics","category":"Finance","status":"Draft","tags":["personal"],"tools":["Zapier","Claude","Notion DB"],"description":"Watches gold and SGD/USD/MYR rates and alerts on threshold moves.","prompt":"Each morning, fetch gold price (SGD/g) and SGD-USD, SGD-MYR rates. Alert if a daily move exceeds 1.5 percent or if a rate crosses a personally set threshold. Include a 3-day mini chart in text."},{"day":75,"name":"Plant Care Reminder","pillar":"Life","category":"Household","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion DB"],"description":"Reminds when to water, rotate, or feed indoor plants.","prompt":"Track each plant with species, last watered, last fertilised, light position. Each morning, surface today's care: water X, rotate Y, fertilise Z. Skip if it's rained."},{"day":76,"name":"Form Submission Triager","pillar":"Automation","category":"Inbox","status":"Draft","tags":["consultant","ops"],"tools":["Zapier","Slack","Notion DB"],"description":"Routes lead form submissions by intent and notifies the right owner.","prompt":"When a lead form is submitted, classify intent: Hire / Workshop / Speaking / Question. Route to the appropriate Notion DB and Slack channel. Auto-respond with a tailored acknowledgement and next step."},{"day":77,"name":"Webinar Promotion Writer","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator","consultant"],"tools":["Notion AI","Claude"],"description":"Generates 4-week promo plan for a webinar: posts, emails, reminders.","prompt":"Given webinar topic, date, and audience, draft: 6 social posts (LinkedIn + X), 3 emails (announce / mid / final reminder), 2 SMS reminders. UK English, calm voice, no urgency tricks."},{"day":78,"name":"Family Photo Sorter","pillar":"Automation","category":"Family","status":"Draft","tags":["parent","personal"],"tools":["Zapier","Claude"],"description":"Sorts new family photos into albums by date and faces.","prompt":"When new photos sync to the family Google Drive, group by date and detected faces. Create monthly albums and a 'best 5' selection per month. Skip blurry / duplicate shots."},{"day":79,"name":"Mosque Roster Planner","pillar":"Life","category":"Faith","status":"Draft","tags":["personal"],"tools":["Notion AI","Google Sheets"],"description":"Helps draft a duty roster for community mosque volunteers.","prompt":"Given a list of volunteers and their availability, draft a rotating monthly roster for Friday duties (greeter, sound, kids area, cleaning). Balance load and avoid back-to-back assignments."},{"day":80,"name":"Annual Goals Reviewer","pillar":"Analytics","category":"Admin","status":"Draft","tags":["founder","personal"],"tools":["Notion AI","Notion DB"],"description":"Reviews annual goals against actuals each quarter.","prompt":"At the end of each quarter, compare each annual goal vs current progress. Flag goals at risk (less than 50% pace), goals to retire, and one new bet worth adopting for next quarter."},{"day":81,"name":"Daily Journal Prompter","pillar":"Life","category":"Family","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion DB"],"description":"Asks one journal prompt each morning, rotated through themes.","prompt":"Each morning, ask one journal prompt rotating through: gratitude, fear, friction, learning, vision, faith, family. Save responses to the Journal DB. Surface a 6-month-ago entry once a week."},{"day":82,"name":"Article SEO Critic","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator","journalist"],"tools":["Claude","Notion AI"],"description":"Reviews an article draft for SEO, clarity, and Nasri's voice match.","prompt":"Given a draft, review: primary keyword usage, H2 structure, internal link opportunities, meta description suggestion. Then assess voice match: does it sound like Nasri (warm, plainspoken)? Mark items to keep/cut."},{"day":83,"name":"Lead Source Analyser","pillar":"Analytics","category":"CRM","status":"Draft","tags":["founder","ops"],"tools":["Notion DB","Google Sheets"],"description":"Identifies highest-LTV lead sources by channel.","prompt":"Each month, segment closed-won deals by first-touch source. Compute avg deal size, time-to-close, retention. Output top 3 sources, weakest source, and a budget reallocation suggestion."},{"day":84,"name":"Recurring Bill Sweeper","pillar":"Automation","category":"Finance","status":"Draft","tags":["personal","ops"],"tools":["Gmail","Zapier","Notion DB"],"description":"Pulls recurring bills from email and updates the bills DB.","prompt":"Each Monday, scan email for new invoices/bills with recurring keywords. Add to the Bills DB with vendor, amount, frequency, due date, and category. Flag any amount change vs last month."},{"day":85,"name":"Travel Packing List","pillar":"Life","category":"Household","status":"Draft","tags":["parent","personal"],"tools":["Notion AI"],"description":"Generates a tailored packing list for a given trip.","prompt":"Given destination, dates, weather, and trip type (work, family, umrah, leisure), produce a packing list grouped by category. Mark essentials with a star. Include a 'last 10 minutes' checklist."},{"day":86,"name":"GitHub Issue Triager","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops","consultant"],"tools":["GitHub","Linear","Webhooks"],"description":"Triages new GitHub issues into Linear with severity and labels.","prompt":"When a GitHub issue is opened, classify type (bug, feature, docs), severity, and customer impact. Create a Linear issue with labels and link back to GitHub. Auto-comment on GitHub with the Linear link."},{"day":87,"name":"Client Health Score","pillar":"Analytics","category":"Client Ops","status":"Draft","tags":["consultant","ops"],"tools":["Notion DB","Slack"],"description":"Computes a per-client health score combining usage, sentiment, and engagement.","prompt":"For each active client, combine: meeting frequency, response latency, last positive comment, open issues, on-time delivery. Output a 0-100 score with color and a 'reach out reason' for any score under 60."},{"day":88,"name":"Discussion Reflection Buddy","pillar":"AI enablement","category":"Learning","status":"Draft","tags":["personal"],"tools":["Notion AI","Claude"],"description":"Turns a conversation transcript into a personal reflection.","prompt":"Given a meaningful conversation transcript, produce: what was said, what was felt, what was unsaid, and one thing to do differently next time. Private journal style. UK English."},{"day":89,"name":"Doctor Visit Note Taker","pillar":"Life","category":"Health","status":"Draft","tags":["parent","personal"],"tools":["Notion AI","Notion DB"],"description":"Captures key info from a doctor's visit and files it.","prompt":"After a doctor visit, ask for: reason, diagnosis, prescription, next steps. Save to the Health DB tied to the family member. Add a follow-up reminder if a re-check is needed."},{"day":90,"name":"Slack Channel Digest","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops"],"tools":["Slack","Claude"],"description":"Posts a morning digest of yesterday's noteworthy Slack threads.","prompt":"Each weekday morning at 08:30, summarise yesterday's top 5 threads from monitored channels. Include thread link, 1-line summary, and any open question. Post to #daily-digest."},{"day":91,"name":"Workshop Brief Generator","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator","consultant"],"tools":["Notion AI","Claude"],"description":"Generates a one-page brief for a new workshop topic.","prompt":"Given a workshop topic and audience, produce a one-page brief: outcome promise, who it's for, agenda outline (90 min), 3 takeaways, suggested pricing tier, and a one-liner."},{"day":92,"name":"Sales Forecaster","pillar":"Analytics","category":"CRM","status":"Draft","tags":["founder","ops"],"tools":["Notion DB","Google Sheets"],"description":"Forecasts next 90 days of revenue from pipeline.","prompt":"Apply stage-weighted probabilities to open deals (lead 10%, qualified 25%, proposal 50%, verbal 80%). Output expected revenue for next 30/60/90 days with confidence range and key assumption risks."},{"day":93,"name":"Faith-based Reflection","pillar":"Life","category":"Faith","status":"Draft","tags":["personal"],"tools":["Notion AI"],"description":"Generates a short reflection on a chosen sifat or virtue weekly.","prompt":"Each Sunday, pick one Islamic virtue (sabr, shukr, ihsan, etc.). Share a verse or hadith, a short reflection, and one practice for the week. Keep it gentle, non-preachy, UK English."},{"day":94,"name":"Birthday & Anniversary Reminders","pillar":"Automation","category":"Family","status":"Draft","tags":["personal","parent"],"tools":["Zapier","WhatsApp","Notion DB"],"description":"Reminds 7 days before any tracked birthday or anniversary.","prompt":"Track birthdays and anniversaries in the People DB. 7 days before, send a WhatsApp reminder with gift ideas based on past notes about the person. On the day, suggest a message draft."},{"day":95,"name":"Tweet Thread Composer","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator"],"tools":["Notion AI","Claude"],"description":"Turns an essay or article into a 6-10 tweet thread.","prompt":"Given an essay, distill the core argument into a 6-10 tweet thread. Tweet 1 is the hook (under 270 chars). Each subsequent tweet stands alone. Final tweet has a soft CTA. UK English, no hashtags."},{"day":96,"name":"Personal Net Worth Tracker","pillar":"Life","category":"Finance","status":"Draft","tags":["personal"],"tools":["Notion DB","Google Sheets"],"description":"Monthly snapshot of assets and liabilities with delta.","prompt":"Each month-end, pull values from each account (manual entry or linked feed). Compute total assets, liabilities, net worth, and delta vs last month. Show category breakdown and a 12-month sparkline."},{"day":97,"name":"Daily Inbox Zero Coach","pillar":"AI enablement","category":"Inbox","status":"Draft","tags":["personal","consultant"],"tools":["Gmail","Notion AI"],"description":"Coaches a 20-minute end-of-day inbox sweep.","prompt":"At 17:00, list unread + open emails. For each, suggest: archive, reply now (2-min rule), schedule, or delegate. Provide a one-line draft reply for the 'reply now' batch. Aim for inbox under 10."},{"day":98,"name":"Vendor Comparison Researcher","pillar":"AI enablement","category":"Research","status":"Draft","tags":["consultant","ops"],"tools":["Claude","Notion AI"],"description":"Compares 3 vendors against a need with pricing, fit, and risks.","prompt":"Given a need and 3 vendor candidates, produce a comparison table: pricing tiers, top features, integration with current stack, switching costs, and red flags. Recommend a winner with a 2-line rationale."},{"day":99,"name":"Marketing Spend Auditor","pillar":"Analytics","category":"Finance","status":"Draft","tags":["founder","ops"],"tools":["Notion DB","Google Sheets"],"description":"Reports ROI per marketing channel monthly.","prompt":"Each month, divide spend by attributed pipeline per channel (ads, content, sponsorships, events). Output ROI per channel and recommend a reallocation: keep, cut, or test more."},{"day":100,"name":"Client Retention Risk Flagger","pillar":"Analytics","category":"CRM","status":"Draft","tags":["consultant","ops"],"tools":["Notion DB","Slack"],"description":"Flags clients at risk of churn using engagement signals.","prompt":"Weekly, flag clients with: declining session frequency, longer response latency, fewer questions, or any negative sentiment. Output a Watchlist with last 3 signals each and one outreach idea."},{"day":101,"name":"Document Search Helper","pillar":"AI enablement","category":"Research","status":"Draft","tags":["consultant","ops"],"tools":["Notion AI","Claude"],"description":"Finds the right doc in the workspace given a fuzzy question.","prompt":"Take a fuzzy question like 'where's the onboarding template?' and search Notion + Google Drive. Return the 3 most likely matches with direct links and one-line previews. Ask a clarifier if confidence is low."},{"day":102,"name":"Notion Page Layout Designer","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["consultant","creator"],"tools":["Notion AI"],"description":"Suggests a clean layout for a given page's purpose.","prompt":"Given a page's purpose (dashboard, doc, hub, landing), suggest a Notion layout: blocks to use, column structure, what should be at the top, what belongs in toggles. Keep it minimalist."},{"day":103,"name":"AI Meeting Notes Filer","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops","consultant"],"tools":["Notion AI","Notion DB"],"description":"Files Notion AI meeting notes into the right client folder.","prompt":"When a meeting note is created, detect the client from attendees and meeting title. Move the note to the right client folder and tag it. If client is ambiguous, ask once. Never file with a wrong client."},{"day":104,"name":"Solo-coach Lead Nurturer","pillar":"Automation","category":"CRM","status":"Draft","tags":["solo-coach"],"tools":["Zapier","Gmail"],"description":"Nurtures a solo coach's leads with weekly value emails for 6 weeks.","prompt":"Given a new lead from a solo coach's funnel, send 6 weekly nurture emails: insight, story, question, resource, case, soft pitch. UK English, calm. Stop sequence if lead replies or books a call."},{"day":105,"name":"Story Pitch Helper","pillar":"AI enablement","category":"Writing","status":"Draft","tags":["journalist","creator"],"tools":["Notion AI","Claude"],"description":"Turns a raw idea into a pitchable story angle.","prompt":"Given a topic and rough notes, draft a story pitch in journalist style: hook, why now, sources to talk to, scope, ideal outlet. Under 200 words, UK English."},{"day":106,"name":"Calendar Defrag Coach","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["personal","consultant"],"tools":["Notion Calendar","Notion AI"],"description":"Suggests how to defrag a fragmented calendar week.","prompt":"Each Friday, scan the upcoming week's calendar. Identify fragmentation: lots of 30-min gaps, scattered meetings. Suggest 2-3 moves to create a solid focus block. Draft reschedule messages for affected attendees."},{"day":107,"name":"Sermon Notes Summariser","pillar":"Life","category":"Faith","status":"Draft","tags":["personal"],"tools":["Claude","Notion AI"],"description":"Summarises a khutbah or lecture into a personal notes page.","prompt":"Given a sermon recording or transcript, produce: speaker, date, theme, 3 main points, supporting verses/hadith, and one application for the week. UK English, respectful tone."},{"day":108,"name":"Form Field Cleaner","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops"],"tools":["Zapier","Notion DB"],"description":"Standardises form-submitted text (case, whitespace, country names).","prompt":"For each new form submission, normalise: name casing (title case), trim whitespace, lowercase emails, standardise country/region names. Do not touch free-text answers. Log any change in an audit field."},{"day":109,"name":"Webhook to Notion Logger","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops"],"tools":["Webhooks","Zapier","Notion DB"],"description":"Generic webhook receiver that logs structured events to a Notion DB.","prompt":"Receive a webhook payload, validate against a known schema (per source), and append a row to the right Events DB. Stash unknown payloads in an Unrouted DB and notify in Slack for review."},{"day":110,"name":"Family Meal Vote Bot","pillar":"Life","category":"Family","status":"Draft","tags":["parent","personal"],"tools":["WhatsApp","Zapier"],"description":"Runs a 2-question vote in the family chat to pick tonight's dinner.","prompt":"At 17:00, send a WhatsApp message to the family group with 3 dinner options based on what's in the fridge. Tally replies. By 17:45, post the winner with the recipe link."},{"day":111,"name":"Skill Critic & Improver","pillar":"AI enablement","category":"Learning","status":"Draft","tags":["consultant","creator"],"tools":["Notion AI","Claude"],"description":"Reviews a skill and suggests improvements after 10 uses.","prompt":"When a skill has been used 10 times, analyse outputs and any human edits. Suggest specific improvements to the prompt: ambiguity to remove, missing constraints, format upgrades. Output a v2 prompt draft."},{"day":112,"name":"Daily Walk Reminder","pillar":"Life","category":"Health","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion Calendar"],"description":"Reminds for a 15-minute walk if you've been sitting too long.","prompt":"Check calendar/activity throughout the day. If no movement has been logged by 14:00, send a gentle nudge to take a 15-min walk. Suggest a route based on the weather and current location."},{"day":113,"name":"Weekly Content Calendar","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator"],"tools":["Notion AI","Notion DB"],"description":"Plans the week's content across channels in one shot.","prompt":"Each Sunday, plan the upcoming week's content: 3 LinkedIn posts, 2 X threads, 1 newsletter. Assign a theme per day. Show what's new vs repurposed. Flag any topical hooks worth pouncing on."},{"day":114,"name":"Recurring Expense Categoriser","pillar":"Automation","category":"Finance","status":"Draft","tags":["personal","ops"],"tools":["Claude","Notion DB"],"description":"Auto-categorises new expense rows by merchant pattern.","prompt":"When a new expense row is created without category, match merchant against historical patterns. If confidence above 90%, set category. Otherwise leave blank and flag for review. Never overwrite a human category."},{"day":115,"name":"Workout Plan Generator","pillar":"Life","category":"Health","status":"Draft","tags":["personal"],"tools":["Notion AI","Claude"],"description":"Designs a 4-week training block matched to a goal.","prompt":"Ask for goal (strength, conditioning, mobility), days/week, equipment, and any niggles. Output a 4-week block with weekly sessions, progression notes, and a deload week. Encourage consistency over intensity."},{"day":116,"name":"Client Slack Channel Watcher","pillar":"Automation","category":"Client Ops","status":"Draft","tags":["consultant","ops"],"tools":["Slack","Claude"],"description":"Watches client Slack channels and surfaces unread mentions.","prompt":"Every 4 hours, summarise unread messages and direct mentions in client Slack channels. Post a digest to a personal DM with thread links and a suggested reply window per item."},{"day":117,"name":"Sales Pipeline Cleanup","pillar":"Automation","category":"CRM","status":"Draft","tags":["ops","founder"],"tools":["Notion DB","Zapier"],"description":"Closes stale pipeline rows and archives dead leads.","prompt":"Monthly, find deals with no activity in 60 days. For each, suggest close-lost reason from past notes. Mark Closed-Lost if no human input within 5 business days. Archive cold leads after 12 months."},{"day":118,"name":"Quarterly Theme Picker","pillar":"AI enablement","category":"Learning","status":"Draft","tags":["personal","founder"],"tools":["Notion AI","Notion DB"],"description":"Helps choose one quarterly theme based on recent reflections.","prompt":"Read the last 90 days of journal entries and goals. Suggest 3 candidate themes for next quarter with rationale. Each theme: a verb, a focus area, and a 6-word vision sentence."},{"day":119,"name":"Kids' Bedtime Routine Coach","pillar":"Life","category":"Family","status":"Draft","tags":["parent"],"tools":["Notion AI"],"description":"Guides a calm 30-minute bedtime routine for the child.","prompt":"Each evening from 19:30, prompt the steps: bath, pyjamas, two books, du'a, cuddle, lights. Adapt order based on the child's mood today. Stay calm and minimise screens."},{"day":120,"name":"Customer Voice Synthesiser","pillar":"AI enablement","category":"Research","status":"Draft","tags":["consultant","founder"],"tools":["Claude","Notion AI"],"description":"Synthesises customer feedback into JTBD-style themes.","prompt":"Given customer interview transcripts or feedback, cluster into Jobs-to-be-Done style themes: situation, motivation, expected outcome, current frustration. Surface 3 themes with verbatim quotes and one product implication."},{"day":121,"name":"New Contact Researcher","pillar":"Automation","category":"CRM","status":"Draft","tags":["consultant","founder"],"tools":["Claude","Zapier","Notion DB"],"description":"When a new contact is added, researches them and writes a brief.","prompt":"When a new contact is added to the People DB, search LinkedIn and the web. Write a 5-line brief: role, company, recent work, mutual context, one good opening line. Skip if low-confidence."},{"day":122,"name":"Quranic Memorisation Tracker","pillar":"Life","category":"Faith","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion DB"],"description":"Tracks daily memorisation progress with revision reminders.","prompt":"Track surah/ayah being memorised. Each morning, prompt for today's new ayat and revision set (yesterday + 7 days ago + 30 days ago). Save progress and surface gentle revision reminders."},{"day":123,"name":"Project Risk Watcher","pillar":"Analytics","category":"Client Ops","status":"Draft","tags":["consultant","ops"],"tools":["Notion DB","Notion AI"],"description":"Surfaces project risk based on milestone slippage and team mood.","prompt":"For each active project, compute milestone slip days, open blockers, and team mood (from standup notes). Output a risk score Low/Med/High with a one-line driver and one mitigation idea."},{"day":124,"name":"Article Headline Tester","pillar":"AI enablement","category":"Writing","status":"Draft","tags":["creator","journalist"],"tools":["Notion AI","Claude"],"description":"Generates 8 headline variants and ranks by clarity and curiosity.","prompt":"Given an article, write 8 headline variants across styles: how-to, list, story, contrarian, question, declarative. Rank by clarity (will the reader know what they get?) and curiosity. Pick a winner with rationale."},{"day":125,"name":"Daily Tasks Reorderer","pillar":"Automation","category":"Admin","status":"Draft","tags":["personal","consultant"],"tools":["Notion AI","Notion DB"],"description":"Reorders today's tasks by ROI and energy curve.","prompt":"Each morning at 08:00, reorder today's tasks. Top: high-leverage deep work matching morning energy. Middle: meetings + collaboration. Bottom: admin + low-effort wins. Cap at 5 must-dos."},{"day":126,"name":"Vendor SOC 2 Status Watcher","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops","consultant"],"tools":["Zapier","Claude","Notion DB"],"description":"Tracks SOC 2 status of vendors and alerts on expiry.","prompt":"Track each vendor's SOC 2 certification date and renewal. Alert 60 days before expiry. Re-check the trust centre quarterly; flag any change in scope, sub-processors, or incident reports."},{"day":127,"name":"Tweet Reply Drafter","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator"],"tools":["Claude","Notion AI"],"description":"Drafts a reply to a mention or DM in Nasri's voice.","prompt":"Given a tweet or DM, draft a reply: warm, plainspoken, UK English, under 240 chars. Match the original's tone. Never argue. Add value or ask one curious question. Flag anything sensitive for manual review."},{"day":128,"name":"Weekly Reflection Companion","pillar":"Life","category":"Family","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion DB"],"description":"Walks through a 10-minute weekly reflection on Friday evening.","prompt":"Each Friday at 21:30, guide a 10-minute reflection: what worked, what didn't, what's next. Ask one question at a time. Save the conversation as a journal entry. End with a du'a or quiet line."},{"day":129,"name":"Inbox Newsletter Filter","pillar":"Automation","category":"Inbox","status":"Draft","tags":["personal"],"tools":["Gmail","Zapier"],"description":"Routes newsletter emails into a dedicated reading folder.","prompt":"Detect newsletter emails by sender and content signals. Move into a 'Reading' folder. Surface a daily 10-minute reading digest with the top 3 worth opening, based on past read behaviour."},{"day":130,"name":"Client SLA Tracker","pillar":"Analytics","category":"Client Ops","status":"Draft","tags":["consultant","ops"],"tools":["Notion DB","Slack"],"description":"Tracks response and delivery SLAs per client and flags breaches.","prompt":"For each client engagement with an SLA, track response time and delivery dates. Compute weekly compliance percentage. Flag breaches in Slack with a one-line root cause and a recovery action."},{"day":131,"name":"Family Calendar Sync","pillar":"Automation","category":"Family","status":"Draft","tags":["parent","personal"],"tools":["Notion Calendar","Google Calendar","Zapier"],"description":"Syncs school, work, and family events into a single shared view.","prompt":"Pull events from school portal, work calendar, and personal calendar. Merge into a single Family Calendar with colour-coded sources. Flag conflicts between school and work activities each Sunday."},{"day":132,"name":"Research Source Validator","pillar":"AI enablement","category":"Research","status":"Draft","tags":["journalist"],"tools":["Claude","Notion AI"],"description":"Validates a source's credibility before citing in a story.","prompt":"Given a URL or source, check: domain reputation, author credentials, citation patterns, primary vs secondary, and recency. Output a credibility score Low/Med/High with reasoning. Never cite Low sources without disclosure."},{"day":133,"name":"Notion Database Migration Planner","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["consultant","ops"],"tools":["Notion AI","Claude"],"description":"Plans a safe migration from one schema to another.","prompt":"Given current schema and target schema, output a migration plan: column mappings, type conversions, default value strategy, backfill order, rollback path, and a smoke-test checklist. Keep destructive ops gated behind confirmation."},{"day":134,"name":"Receipt OCR Bot","pillar":"Automation","category":"Finance","status":"Draft","tags":["ops","personal"],"tools":["Claude","Zapier"],"description":"Reads a photographed receipt and extracts structured fields.","prompt":"Given a receipt image, extract: merchant, date, total, tax, currency, items (if visible), payment method. Output structured JSON. Confidence scores per field. Flag amounts unreadable for manual review."},{"day":135,"name":"Weekly Cashflow Forecast","pillar":"Analytics","category":"Finance","status":"Draft","tags":["founder","ops"],"tools":["Notion DB","Google Sheets"],"description":"Projects the next 4 weeks of cash in/out based on confirmed and expected items.","prompt":"Each Monday, project the next 4 weeks: confirmed inflows (invoices sent), expected inflows (verbal deals), confirmed outflows (subscriptions, salaries), expected outflows (variable). Output a week-by-week table with running balance."},{"day":136,"name":"Daily Adhkar Reminder","pillar":"Life","category":"Faith","status":"Draft","tags":["personal"],"tools":["Notion AI","WhatsApp"],"description":"Reminds for morning and evening adhkar with a short selection.","prompt":"Send two daily reminders: after Fajr for morning adhkar, after Maghrib for evening. Include a curated short list (5 items each) with Arabic, transliteration, and English. Vary the selection weekly."},{"day":137,"name":"Lead-Form Auto Reply","pillar":"Automation","category":"CRM","status":"Draft","tags":["consultant","ops"],"tools":["Zapier","Gmail"],"description":"Auto-replies to a lead within 2 minutes with a tailored next step.","prompt":"When a lead form is submitted, send an immediate reply within 2 minutes. Acknowledge by name, reference the topic they wrote about, suggest one specific next step (e.g. a 15-min scoping call link). UK English, calm."},{"day":138,"name":"Notion Property Naming Coach","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["consultant","ops"],"tools":["Notion AI","Notion DB"],"description":"Coaches consistent, clean property naming across DBs.","prompt":"Audit property names across selected DBs. Flag inconsistencies (e.g. 'Owner' vs 'Assignee'), unclear names, and orphan terms. Suggest a unified glossary and a rename plan with safe order."},{"day":139,"name":"Conversation Outcome Logger","pillar":"Automation","category":"CRM","status":"Draft","tags":["consultant","ops"],"tools":["Notion AI","Slack"],"description":"Logs a brief outcome to the CRM after each meaningful conversation.","prompt":"After a meeting or DM thread closes, prompt for 3 fields: outcome (Won / Lost / Pending), next step, owner. Save to the CRM. Keep prompts under 10 seconds to answer."},{"day":140,"name":"Habit Re-onboarding Coach","pillar":"Life","category":"Health","status":"Draft","tags":["personal"],"tools":["Notion AI"],"description":"Re-onboards a broken habit gently and without guilt.","prompt":"When a tracked habit lapses 5+ days, suggest a re-onboarding plan: smaller version of the habit (2-min rule), tied to an existing cue, with a 7-day kindness window. Never use guilt language."},{"day":141,"name":"Tutorial Outline Writer","pillar":"AI enablement","category":"Writing","status":"Draft","tags":["creator","consultant"],"tools":["Notion AI","Claude"],"description":"Drafts a clear how-to tutorial outline from a workflow.","prompt":"Given a workflow, draft a tutorial outline: who it's for, expected outcome, prerequisites, step-by-step (max 7 steps), gotchas, and a 'now you can' summary. Suggest visuals where helpful."},{"day":142,"name":"Client Invoice Status Checker","pillar":"Automation","category":"Finance","status":"Draft","tags":["ops","founder"],"tools":["Notion DB","Zapier"],"description":"Checks invoice status and notifies on overdue items.","prompt":"Each Tuesday, check open invoices. Flag overdue items (over due date), aging buckets (30/60/90), and any client with 2+ overdue. Suggest who to ping and the tone (gentle, firm, escalate)."},{"day":143,"name":"Project Burn-down Chart","pillar":"Analytics","category":"Client Ops","status":"Draft","tags":["consultant","ops"],"tools":["Notion DB","Notion AI"],"description":"Tracks remaining work vs planned timeline for each project.","prompt":"For each active project, compute remaining tasks vs ideal burndown. Show actual vs ideal as a simple text chart. Flag projects more than 20% behind. Recommend a scope cut or deadline shift."},{"day":144,"name":"Faith Q&A Researcher","pillar":"AI enablement","category":"Faith","status":"Draft","tags":["personal"],"tools":["Claude","Notion AI"],"description":"Researches a faith question with multiple authentic sources.","prompt":"Given a faith question, search Sunnah.com, Quran.com, IslamQA, and reputable scholar sites. Present 2-3 perspectives (with sources), flag mainstream vs minority views, and note where scholars disagree. Never issue a fatwa."},{"day":145,"name":"Sunday Reset Planner","pillar":"Life","category":"Household","status":"Draft","tags":["personal","parent"],"tools":["Notion AI","Notion Calendar"],"description":"Walks through a 30-minute Sunday reset for the week ahead.","prompt":"Each Sunday at 16:00, guide a 30-minute reset: tidy inbox, review last week's wins, set 3 priorities for the week, plan deep work blocks, prep meals, charge devices. Mark each step done as we go."},{"day":146,"name":"Inbox Snooze Triage","pillar":"Automation","category":"Inbox","status":"Draft","tags":["personal","consultant"],"tools":["Gmail","Zapier"],"description":"Snoozes non-urgent emails to surface at the right time.","prompt":"For non-urgent incoming emails, choose a snooze: tomorrow morning, end of week, or 2 weeks. Use sender history and content as signal. Surface a daily 'snoozed today' list with one-line previews."},{"day":147,"name":"GitHub Release Notes Drafter","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops"],"tools":["GitHub","Claude"],"description":"Drafts release notes from merged PRs since last release.","prompt":"Given merged PRs since last release tag, draft release notes: Added, Changed, Fixed, Deprecated. UK English, plainspoken. Group similar changes. Include a one-line headline at top."},{"day":148,"name":"Notion Help-doc Finder","pillar":"AI enablement","category":"Learning","status":"Draft","tags":["consultant","personal"],"tools":["Notion AI"],"description":"Finds the right Notion help doc for a feature question.","prompt":"When asked a 'how do I do X in Notion' question, search Notion's help center. Return the 2 most relevant doc links with a one-line answer summary. Do not invent steps; cite the doc."},{"day":149,"name":"Workshop Attendee Follow-up","pillar":"Automation","category":"Content","status":"Draft","tags":["creator","consultant"],"tools":["Zapier","Gmail"],"description":"Sends a 3-touch follow-up to workshop attendees.","prompt":"After a workshop, send: Day 0 thank-you with slides + recording, Day 3 one application question, Day 14 invite to deeper engagement (call or community). Personalise by attendee role if known."},{"day":150,"name":"Tax Doc Collector Bot","pillar":"Automation","category":"Finance","status":"Draft","tags":["personal","ops"],"tools":[],"description":"Collects tax-relevant docs from email throughout the year.","prompt":"Throughout the year, detect tax-relevant emails (invoices, donation receipts, dividend statements, CPF). Save attachments to a Tax/<YYYY> folder. Quarterly summary of what's been collected."},{"day":151,"name":"Daily Energy Forecast","pillar":"Analytics","category":"Health","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion Calendar"],"description":"Forecasts your energy curve for the day based on sleep and load.","prompt":"Each morning, take sleep score, training load, and today's meeting density. Forecast energy curve (peak window, dip, recovery). Suggest where to place deep work and what to defer."},{"day":152,"name":"Meeting Conflict Coach","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["consultant"],"tools":["Notion Calendar","Claude"],"description":"Resolves meeting conflicts by ranking importance.","prompt":"When two meetings overlap, score each on: importance, replaceability, my contribution, and notice given. Recommend which to keep and draft a polite decline for the other with two alternative slots."},{"day":153,"name":"Sales Email A/B Tester","pillar":"Analytics","category":"CRM","status":"Draft","tags":["founder","ops"],"tools":["Zapier","Gmail"],"description":"Splits new contacts across two email variants and reports.","prompt":"Given a sales sequence, randomly assign new contacts to variant A or B. Track opens, replies, meetings booked. After 50 sends per variant, report winner with confidence and recommend rolling forward."},{"day":154,"name":"Notion Dashboard Critic","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["consultant"],"tools":["Notion AI"],"description":"Critiques a dashboard for clarity, hierarchy, and noise.","prompt":"Review a dashboard page. Score on: top-of-page clarity (can a new viewer say what this is in 5 sec?), visual hierarchy, data density, and noise. Suggest 3 specific edits prioritised by impact."},{"day":155,"name":"Faith Reading List Curator","pillar":"Life","category":"Faith","status":"Draft","tags":["personal"],"tools":["Claude","Notion AI"],"description":"Curates a monthly faith reading list of articles and chapters.","prompt":"Each month, suggest 4 readings (mix: a tafsir chapter, a seerah chapter, a contemporary scholar article, a classical text excerpt). Match to current theme of life. UK English."},{"day":156,"name":"Slack Question Answerer","pillar":"Automation","category":"Client Ops","status":"Draft","tags":["ops","consultant"],"tools":["Slack","Notion AI"],"description":"Watches a help channel and drafts answers from internal docs.","prompt":"When a question is posted in #help, search Notion docs for relevant answer. Draft a reply with cited sources as a thread reply for human review. Never post directly without human confirm."},{"day":157,"name":"Lead Decay Reminder","pillar":"Automation","category":"CRM","status":"Draft","tags":["founder","ops"],"tools":["Notion DB","Slack"],"description":"Surfaces leads that haven't been touched in 14 days.","prompt":"Daily, find leads with no activity in 14 days that are still 'Open'. List by deal value, with a one-line note on last touch and a suggested next move. Group by owner."},{"day":158,"name":"Newsletter Engagement Reporter","pillar":"Analytics","category":"Content","status":"Draft","tags":["creator"],"tools":["Zapier","Claude"],"description":"Reports newsletter open/click rates and what worked.","prompt":"After each newsletter send, pull stats: opens, clicks, unsubscribes, top-clicked link. Compare against rolling 6-issue average. Note what likely drove the result. One short paragraph."},{"day":159,"name":"Storeroom Inventory Tracker","pillar":"Automation","category":"Household","status":"Draft","tags":["parent","personal"],"tools":["Notion DB","WhatsApp"],"description":"Tracks household storeroom items and flags running low.","prompt":"Track key household items (rice, oil, washing powder, nappies, etc). Each Sunday, prompt for quick stock check. Auto-add to shopping list anything below threshold. Adjust thresholds based on usage rate."},{"day":160,"name":"AI Skill Library Curator","pillar":"AI enablement","category":"Learning","status":"Draft","tags":["consultant","creator"],"tools":["Notion DB","Claude"],"description":"Curates AI skills/prompts library by use case.","prompt":"Browse the prompt library weekly. Tag each prompt by use case, audience, and tool. Flag duplicates and suggest consolidation. Surface the 5 most-used and the 5 stalest."},{"day":161,"name":"1:1 Action Item Extractor","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["consultant","ops"],"tools":["Notion AI","Claude"],"description":"Pulls action items out of 1:1 meeting notes and assigns owners.","prompt":"Given a 1:1 transcript or notes, extract action items as: task, owner, due date, source quote. Output a clean table. Flag any item missing an owner or date."},{"day":162,"name":"Outdoor Adventure Picker","pillar":"Life","category":"Family","status":"Draft","tags":["parent","personal"],"tools":["Notion AI","Claude"],"description":"Picks an outdoor activity given today's weather and the family's energy.","prompt":"Given today's weather, family's energy level, and time available, suggest 1 outdoor activity (park, beach, trail, ride). Include directions, what to pack, and return time."},{"day":163,"name":"DB Backup Reminder","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops"],"tools":[],"description":"Reminds to export key Notion DBs monthly to Drive.","prompt":"On the 1st of each month, export defined-critical Notion DBs (CRM, Finance, Projects) as CSV to a Drive backup folder. Confirm completion in Slack with row counts vs last month."},{"day":164,"name":"PR Quote Drafter","pillar":"AI enablement","category":"Writing","status":"Draft","tags":["creator","founder","journalist"],"tools":["Claude","Notion AI"],"description":"Drafts a journalist-ready quote on a topic.","prompt":"Given a topic and angle, draft 3 quote variants in Nasri's voice: punchy (under 25 words), nuanced (under 50 words), and personal story (under 60 words). UK English, no hype."},{"day":165,"name":"Spending Anomaly Detector","pillar":"Analytics","category":"Finance","status":"Draft","tags":["personal","ops"],"tools":["Notion DB","Google Sheets"],"description":"Flags unusual spending against rolling baseline.","prompt":"Compare this week's spending by category against rolling 12-week median. Flag any category more than 50% above baseline with the top transactions driving it. Suggest a one-line check-in question."},{"day":166,"name":"Sermon Audio Transcriber","pillar":"Automation","category":"Faith","status":"Draft","tags":["personal"],"tools":["Claude","Zapier"],"description":"Transcribes a sermon audio file and stores it with metadata.","prompt":"Given an audio URL, transcribe it. Store with: speaker (if known), date, masjid/source, theme tags. Output a 5-line summary at the top of the page for quick reference."},{"day":167,"name":"Workspace Permissions Auditor","pillar":"Analytics","category":"Admin","status":"Draft","tags":["ops"],"tools":["Notion AI"],"description":"Audits page sharing settings for sensitive pages.","prompt":"Quarterly, scan a defined list of sensitive pages and DBs. Report sharing settings (public, workspace, specific people). Flag any unexpectedly public pages. Suggest changes; never auto-change."},{"day":168,"name":"Salah Tracker","pillar":"Life","category":"Faith","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion DB"],"description":"Tracks daily prayers with gentle weekly summary.","prompt":"Each day, quietly log salah completion (5 prayers). On Friday afternoons, summarise the week: completion percentage, on-time percentage, any pattern (e.g. Asr often missed). No judgement."},{"day":169,"name":"Email Thread Summariser","pillar":"AI enablement","category":"Inbox","status":"Draft","tags":["consultant","ops"],"tools":["Gmail","Claude"],"description":"Summarises a long email thread into a compact recap.","prompt":"Given a long email thread, produce: TL;DR (one sentence), key decisions, open questions, action items with owners. Preserve key quotes inline where they add evidence."},{"day":170,"name":"Annual Review Compiler","pillar":"AI enablement","category":"Learning","status":"Draft","tags":["personal","founder"],"tools":["Notion AI","Notion DB","Claude"],"description":"Compiles a complete annual review from journal + DBs at year end.","prompt":"In December, compile annual review: highlights, lessons, numbers (work, finance, health), what changed, what didn't, biggest mistake, biggest win, next year's question. Source from journal, CRM, finance, habits."},{"day":171,"name":"Lead Welcome Drip","pillar":"Automation","category":"Content","status":"Draft","tags":["creator"],"tools":["Zapier","Gmail"],"description":"Sends a 3-email welcome drip to new newsletter subscribers.","prompt":"When a new subscriber jo
