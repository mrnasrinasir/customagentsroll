ins, send: Day 0 personal welcome with origin story, Day 3 best-of post, Day 7 invitation to reply with their biggest question. UK English, warm."},{"day":172,"name":"Reading Habit Coach","pillar":"Life","category":"Learning","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion DB"],"description":"Coaches a 20-page-a-day reading habit.","prompt":"Each evening, prompt: did you read 20 pages today? Suggest the next chapter from current book(s). Weekly, surface progress and propose the next book when current one nears the end."},{"day":173,"name":"Notion Formula Helper","pillar":"AI enablement","category":"Learning","status":"Draft","tags":["consultant","creator"],"tools":["Notion AI","Claude"],"description":"Writes and explains a Notion formula given a plain-English ask.","prompt":"Given a plain-English description of what a formula should do, write a clean Notion formula. Explain each function used. Suggest a test row to verify. Note if a property type needs changing."},{"day":174,"name":"Workshop Slide Reviewer","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator","consultant"],"tools":["Notion AI","Claude"],"description":"Reviews slides for clarity, density, and a clear takeaway per slide.","prompt":"Given slide content, check each slide for: a clear one-line takeaway, density (one idea per slide), and visual hierarchy. Flag overcrowded slides and suggest a split. Output a per-slide checklist."},{"day":175,"name":"Client Proposal QA","pillar":"AI enablement","category":"Client Ops","status":"Draft","tags":["consultant","ops"],"tools":["Notion AI","Claude"],"description":"Quality-checks a proposal before it goes out the door.","prompt":"Given a proposal draft, check: client name spelled right everywhere, scope clarity, timeline realism, pricing math, terms section, signature block, file names. Output a pre-send checklist with pass/fail per item."},{"day":176,"name":"Marriage Check-in Prompter","pillar":"Life","category":"Family","status":"Draft","tags":["personal"],"tools":["Notion AI"],"description":"Surfaces a weekly check-in question for the couple.","prompt":"Each Sunday evening, suggest one warm check-in question for the couple. Rotate themes: appreciation, friction, dreams, logistics, faith, joy. Never repeat the same question within 12 weeks."},{"day":177,"name":"Tweet Engagement Reporter","pillar":"Analytics","category":"Content","status":"Draft","tags":["creator"],"tools":["Zapier","Claude"],"description":"Reports weekly tweet performance and patterns.","prompt":"Each Monday, pull last week's tweet stats. Report top 3 by impressions, top 3 by engagement rate, and one pattern observation. Suggest one experiment for the coming week."},{"day":178,"name":"Notion Mail Auto-archive","pillar":"Automation","category":"Inbox","status":"Draft","tags":["personal"],"tools":["Gmail","Zapier"],"description":"Auto-archives notification and read-only emails to keep the inbox clean.","prompt":"Detect notification emails (no-reply, system messages, receipts) and auto-archive after reading. Keep inbox to actionable items only. Never archive emails with my name in the body."},{"day":179,"name":"Cover Image Suggester","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator"],"tools":["Claude","Notion AI"],"description":"Suggests cover images for a Notion page from the topic.","prompt":"Given a page title and first paragraph, suggest 3 cover image directions (mood, colour palette, subject). Include 3 search queries for Unsplash and 1 generated-image prompt. UK English, calm aesthetic."},{"day":180,"name":"Tahajjud Gentle Nudge","pillar":"Life","category":"Faith","status":"Draft","tags":["personal"],"tools":["Notion AI","WhatsApp"],"description":"Sends a quiet nudge for tahajjud on chosen nights.","prompt":"On nights chosen by the user (e.g. Friday, last 10 of Ramadan), set a quiet alarm 90 min before Fajr. Send a short reminder verse and a 1-line intention. Never wake-up sound. No guilt if missed."},{"day":181,"name":"Subscription Renewal Reviewer","pillar":"Analytics","category":"Finance","status":"Draft","tags":["ops","personal"],"tools":["Notion DB","Claude"],"description":"Reviews upcoming SaaS renewals and recommends keep/cut.","prompt":"On the 1st of each month, list subscriptions renewing in the next 30 days. For each, show usage in last 30 days and cost. Recommend keep, cut, or downgrade with reasoning."},{"day":182,"name":"Pipeline Stage Mover","pillar":"Automation","category":"CRM","status":"Draft","tags":["founder","ops"],"tools":["Notion DB","Zapier"],"description":"Auto-moves deals between stages based on triggers.","prompt":"Auto-move deals: 'New' to 'Qualified' after first call booked; 'Qualified' to 'Proposal' after proposal sent; 'Proposal' to 'Won' on signed contract. Never skip stages. Notify owner on each move."},{"day":183,"name":"Weekly Health Reporter","pillar":"Analytics","category":"Health","status":"Draft","tags":["personal"],"tools":["Notion DB","Claude"],"description":"Reports weekly health metrics with one habit recommendation.","prompt":"Each Sunday, summarise: sleep average, steps, training sessions, weight delta, water. Identify the metric with biggest delta vs baseline and recommend one small habit shift for the coming week."},{"day":184,"name":"Quranic Reflection Writer","pillar":"AI enablement","category":"Faith","status":"Draft","tags":["personal"],"tools":["Claude","Notion AI"],"description":"Writes a short reflection on a chosen verse for the day.","prompt":"Given an ayah, write a 150-word personal reflection: meaning in context, classical commentary in 1 line, one practical application for today's life. UK English, calm."},{"day":185,"name":"Family Photo Album Curator","pillar":"Automation","category":"Family","status":"Draft","tags":["parent","personal"],"tools":["Claude","Zapier"],"description":"Curates a monthly best-of photo album from the camera roll.","prompt":"Each month, surface 30 best photos from the family camera roll: kids' faces clear, no near-duplicates, mix of candid and posed. Compile into a shared album and send a short note to grandparents."},{"day":186,"name":"Discovery Question Bank","pillar":"AI enablement","category":"Client Ops","status":"Draft","tags":["consultant"],"tools":["Notion AI","Claude"],"description":"Curates discovery questions tailored to client type.","prompt":"Given a client's industry and stage, suggest 12 discovery questions split: 3 context, 3 problem, 3 impact, 3 budget/timing. Avoid leading questions. UK English."},{"day":187,"name":"Inbox VIP Alerter","pillar":"Automation","category":"Inbox","status":"Draft","tags":["consultant","founder","personal"],"tools":["Gmail","Slack","Zapier"],"description":"Pings Slack the moment a VIP emails.","prompt":"When an email arrives from a defined VIP list (family, top clients, key partners), send a Slack DM with subject line and 1-line preview within 60 seconds. Never auto-reply on my behalf."},{"day":188,"name":"Workshop ROI Reporter","pillar":"Analytics","category":"Content","status":"Draft","tags":["creator","founder"],"tools":["Notion DB","Google Sheets"],"description":"Reports ROI per workshop in attendees, leads, revenue.","prompt":"After each workshop, compute: attendee count, lead conversions, revenue attributed within 90 days, cost. Output ROI multiple and a one-line takeaway: scale, repeat, or sunset."},{"day":189,"name":"Personal Decision Journal","pillar":"AI enablement","category":"Learning","status":"Draft","tags":["founder","personal"],"tools":["Notion AI","Notion DB"],"description":"Logs significant decisions with predictions for later review.","prompt":"Prompt to capture significant decisions: situation, options considered, choice, reasoning, prediction for 6 months out. Quarterly, surface decisions due for review and compare prediction vs reality."},{"day":190,"name":"Cross-team Status Aggregator","pillar":"Automation","category":"Client Ops","status":"Draft","tags":["consultant","ops"],"tools":["Notion DB","Slack","Zapier"],"description":"Aggregates weekly status from multiple project leads into one update.","prompt":"Each Friday at 16:00, collect status updates from project leads (Notion forms or Slack). Aggregate into one rolled-up update: top wins, top risks, asks. Send to leadership channel by 18:00."},{"day":191,"name":"SaaS Stack Auditor","pillar":"Analytics","category":"Admin","status":"Draft","tags":["ops","founder"],"tools":["Notion DB","Claude"],"description":"Audits the SaaS stack for overlap, cost, and risk.","prompt":"Quarterly, audit the SaaS stack. For each tool: cost, primary use, alternatives in stack, who uses it, last login signal. Flag overlap and zombie tools. Suggest 3 candidates to cut."},{"day":192,"name":"Family Group Chat Recapper","pillar":"AI enablement","category":"Family","status":"Draft","tags":["parent","personal"],"tools":["WhatsApp","Claude"],"description":"Recaps a busy family group chat into a weekly digest.","prompt":"Each Sunday morning, summarise the family WhatsApp group from the week: key events, decisions made, photos shared, action items still open. 5 lines max. UK English."},{"day":193,"name":"Daily Quote Picker","pillar":"Life","category":"Learning","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion DB"],"description":"Picks a daily quote that fits the current theme of life.","prompt":"Each morning, pick one quote that fits the current quarterly theme. Source from a curated library (1000+ quotes). Avoid repeats within 90 days. Include source and one-line reflection."},{"day":194,"name":"Client Engagement Reporter","pillar":"Analytics","category":"Client Ops","status":"Draft","tags":["consultant","ops"],"tools":["Notion DB","Slack"],"description":"Reports per-client engagement (meetings, messages, deliverables) monthly.","prompt":"Monthly, per client: meeting count, message count, deliverables shipped, NPS-style temp check. Flag clients trending down. Suggest a re-engagement call or wind-down conversation."},{"day":195,"name":"Bank Reconciliation Helper","pillar":"Automation","category":"Finance","status":"Draft","tags":["ops","founder"],"tools":["Google Sheets","Notion DB","Zapier"],"description":"Matches bank transactions to invoices and flags unmatched items.","prompt":"Weekly, pull bank transactions and match against the Invoices DB by amount and date. Auto-mark matched as 'Paid'. Flag unmatched amounts for review with the 3 most likely candidates."},{"day":196,"name":"Tweet Idea Bank Filler","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator"],"tools":["Claude","Notion DB"],"description":"Tops up the tweet idea bank from current reads and convos.","prompt":"Twice a week, scan recent saves, highlights, and notable conversations. Generate 10 fresh tweet ideas. Tag by theme. Skip anything that sounds like clickbait or hot-take cosplay."},{"day":197,"name":"Friday Family Dinner Planner","pillar":"Life","category":"Family","status":"Draft","tags":["parent","personal"],"tools":["Notion AI"],"description":"Plans a special Friday dinner and tasks for the family.","prompt":"Each Thursday, plan Friday family dinner: menu (2 mains, 1 side, 1 sweet), shopping list, who cooks what, table setup task for the kids. Keep it cosy, not fancy."},{"day":198,"name":"Sales Demo Recap Generator","pillar":"AI enablement","category":"CRM","status":"Draft","tags":["founder","consultant"],"tools":["Notion AI","Claude","Gmail"],"description":"Generates a follow-up recap email after a sales demo.","prompt":"After a sales demo, take notes + transcript and draft a recap email: thank you, top 3 things they cared about, demo highlights tied to their needs, clear next step with date. UK English, calm."},{"day":199,"name":"Skill Marketplace Lister","pillar":"Automation","category":"Content","status":"Draft","tags":["creator","founder"],"tools":["Notion DB","Claude"],"description":"Auto-lists a finished skill into the public AI skill marketplace.","prompt":"When a skill graduates to Live, draft a marketplace listing: title, 1-line value prop, 3-line description, target user, screenshot suggestion. Stage for human review before publishing."},{"day":200,"name":"Weekly Faith Reflection","pillar":"Life","category":"Faith","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion DB"],"description":"Closes each week with a 3-question faith reflection.","prompt":"Each Saturday evening, ask three quiet questions: what made you grateful, where did your character slip, what is one du'a for the coming week. Save as journal entry, never share without consent."},{"day":201,"name":"Linear Issue Triager","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops","founder"],"tools":["Linear","Claude"],"description":"Triages new Linear issues by impact, urgency, and team.","prompt":"When a new Linear issue arrives, parse title + description. Suggest team, label, priority (P0-P3), and a one-line reason. Auto-assign if confidence is high; otherwise leave for human triage."},{"day":202,"name":"Client Hand-off Generator","pillar":"AI enablement","category":"Client Ops","status":"Draft","tags":["consultant","ops"],"tools":["Notion AI","Claude"],"description":"Generates a clean hand-off doc when a project moves to ops.","prompt":"When a project moves from delivery to ops, draft a hand-off doc: scope, key contacts, access list, recurring tasks, known risks, escalation path. Pull from the project page + meeting notes."},{"day":203,"name":"Birthday Reminder Bot","pillar":"Life","category":"Family","status":"Draft","tags":["personal","parent"],"tools":["Notion DB","Claude"],"description":"Reminds 5 days before a family or friend birthday with gift ideas.","prompt":"5 days before any contact's birthday, send a reminder with: relationship context, last gift given, 3 gift ideas under a chosen budget, a draft message. Skip contacts marked 'no celebration'."},{"day":204,"name":"Article Fact-checker","pillar":"AI enablement","category":"Writing","status":"Draft","tags":["journalist","creator"],"tools":["Claude","Notion AI"],"description":"Fact-checks claims in an article before publishing.","prompt":"Given a draft, extract every factual claim (numbers, names, dates, quotes). For each, verify against a credible source and flag unverified or contradicted claims. Output a table: claim, source, status."},{"day":205,"name":"Daily Top 3 Picker","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["personal","consultant"],"tools":["Notion AI","Notion DB","Notion Calendar"],"description":"Picks the top 3 priorities for today from all open work.","prompt":"Each morning at 07:30, scan all open tasks + calendar + inbox. Suggest today's top 3 priorities using impact vs effort and looming deadlines. Show what to defer or drop."},{"day":206,"name":"LinkedIn DM Personaliser","pillar":"AI enablement","category":"CRM","status":"Draft","tags":["founder","consultant"],"tools":["Claude","Webhooks"],"description":"Personalises a LinkedIn outreach DM from a profile URL.","prompt":"Given a LinkedIn profile URL and a value prop, draft a personalised DM: under 90 words, references one specific thing from their work, no flattery, one clear ask. UK English."},{"day":207,"name":"Family Travel Planner","pillar":"AI enablement","category":"Family","status":"Draft","tags":["parent","personal"],"tools":["Claude","Notion AI"],"description":"Plans a family trip from a budget and dates.","prompt":"Given a destination, dates, budget, and family composition, plan: flights, accommodation options (2 tiers), 1 main activity per day, halal food spots, prayer spaces. Keep daily schedule humane."},{"day":208,"name":"Slack Standup Bot","pillar":"Automation","category":"Client Ops","status":"Draft","tags":["ops"],"tools":["Slack","Zapier","Claude"],"description":"Runs an async standup in Slack for the team each morning.","prompt":"Each weekday at 09:00, post a standup thread in #team. Prompt members for yesterday/today/blockers. Compile responses into a clean digest by 10:30 with blockers flagged."},{"day":209,"name":"Recurring Meeting Auditor","pillar":"Analytics","category":"Admin","status":"Draft","tags":["consultant","ops"],"tools":["Notion Calendar","Notion AI"],"description":"Audits recurring meetings for value and recommends cuts.","prompt":"Quarterly, scan recurring meetings. For each: attendees, frequency, last 3 meeting notes (any decisions?), cost in time. Score Keep/Trim/Cancel with one-line reasoning."},{"day":210,"name":"Personal Knowledge Search","pillar":"AI enablement","category":"Research","status":"Draft","tags":["personal","consultant"],"tools":["Notion AI","Claude"],"description":"Searches across personal notes, highlights, and journal entries.","prompt":"Given a question, search across Notion notes, Readwise highlights, and journal entries. Return up to 5 most relevant snippets with sources and a synthesised 3-line answer."},{"day":211,"name":"Sermon Speaker Tracker","pillar":"Automation","category":"Faith","status":"Draft","tags":["personal"],"tools":["Zapier","Claude"],"description":"Tracks favourite speakers and notifies on new content.","prompt":"Maintain a list of trusted speakers. Weekly, check for new lectures or articles. Send a single digest: speaker, title, length, one-line topic. Skip content already saved."},{"day":212,"name":"Form Spam Filter","pillar":"Automation","category":"Inbox","status":"Draft","tags":["ops"],"tools":["Zapier","Claude"],"description":"Filters out spam form submissions before they hit the inbox.","prompt":"For each new form submission, score spam likelihood: gibberish text, bot signatures, suspicious email domains, contradictory fields. Auto-quarantine high spam. Forward likely real to inbox."},{"day":213,"name":"Customer Win Story Drafter","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator","founder","consultant"],"tools":["Notion AI","Claude"],"description":"Drafts a case study from a customer's journey.","prompt":"Given a customer's onboarding date, key milestones, and a quote, draft a 500-word case study: situation, complication, intervention, outcome. UK English, calm, evidence-led."},{"day":214,"name":"Habit Streak Saver","pillar":"Life","category":"Health","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion DB"],"description":"Sends a save-the-streak nudge if a habit is at risk.","prompt":"Check tracked habits at 21:00. If a daily habit isn't done and the streak is over 7 days, send a gentle nudge: 'you've got 3 hours; here's the 2-min version'. Never shame."},{"day":215,"name":"Client Onboarding Wizard","pillar":"Automation","category":"Client Ops","status":"Draft","tags":["consultant","ops"],"tools":["Notion DB","Zapier","Gmail"],"description":"Walks a new client through onboarding step-by-step.","prompt":"When a new client signs, send a welcome email with onboarding link. Walk them through: contract signed, kickoff scheduled, access shared, intro to team, kickoff prep brief. Notify me at each step."},{"day":216,"name":"Highlight to Tweet","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator"],"tools":["Claude","Notion AI"],"description":"Turns a Kindle/Readwise highlight into a tweet draft.","prompt":"Given a highlight, draft 2 tweet variants: one straight quote with attribution, one personal reflection in my voice. Avoid generic motivational tone. UK English. Add source link."},{"day":217,"name":"Travel Receipt Filer","pillar":"Automation","category":"Finance","status":"Draft","tags":["personal","ops"],"tools":["Gmail","Notion DB","Zapier"],"description":"Files travel receipts to the right trip and prepares an expense claim.","prompt":"On travel days, auto-detect travel receipts (Uber, hotel, flights, food). File under the active trip in the Expenses DB. End of trip, generate an expense claim summary with totals by category."},{"day":218,"name":"Ramadan Planner","pillar":"Life","category":"Faith","status":"Draft","tags":["personal","parent"],"tools":["Notion AI","Notion DB"],"description":"Plans daily routines and goals for the month of Ramadan.","prompt":"Before Ramadan, plan: sahur/iftar logistics, work meeting shifts, family/community plans, daily Quran target, taraweeh nights, nightly intentions. Adjust week 4 to the last 10 nights."},{"day":219,"name":"GitHub PR Reminder","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops"],"tools":["GitHub","Slack","Zapier"],"description":"Reminds reviewers about open PRs assigned to them.","prompt":"Each morning, check open PRs awaiting review. If older than 24 hours, ping the assigned reviewer in Slack with a link and a one-line context. Escalate to me if older than 72 hours."},{"day":220,"name":"Investor Update Drafter","pillar":"AI enablement","category":"Writing","status":"Draft","tags":["founder"],"tools":["Notion AI","Notion DB","Claude"],"description":"Drafts a monthly investor update from KPIs and highlights.","prompt":"Each month, pull KPIs (MRR, churn, headcount, cash) + key wins/risks from the team standup digest. Draft a 1-page update: numbers, what worked, what didn't, asks, looking ahead."},{"day":221,"name":"Kid Homework Helper","pillar":"Life","category":"Family","status":"Draft","tags":["parent"],"tools":["Notion AI","Claude"],"description":"Helps the child with a homework question without giving the answer.","prompt":"Given a homework question, guide the child through with Socratic prompts: ask what they know, point to the relevant concept, offer a simpler analogous problem. Never give the answer outright."},{"day":222,"name":"Survey Response Synthesiser","pillar":"Analytics","category":"Research","status":"Draft","tags":["consultant","founder"],"tools":["Claude","Google Sheets"],"description":"Synthesises open-text survey responses into themes.","prompt":"Given open-text survey responses, cluster into 5-7 themes. For each: count, representative verbatim, one-line insight. Flag any single high-signal response separately. Avoid over-categorising."},{"day":223,"name":"Notion Page Cleaner","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["consultant"],"tools":["Notion AI"],"description":"Cleans formatting cruft on a Notion page in one pass.","prompt":"Given a messy page, do a single-pass cleanup: collapse stacked empty lines, fix heading hierarchy, normalise list styles, remove orphan toggles. Preserve all content. Show a diff summary at end."},{"day":224,"name":"Lead Source Reporter","pillar":"Analytics","category":"CRM","status":"Draft","tags":["founder","ops"],"tools":["Notion DB","Google Sheets"],"description":"Reports lead sources and conversion by source monthly.","prompt":"Monthly, group leads by source (referral, web, LinkedIn, event, etc). Show count, qualification rate, win rate, average deal size. Spotlight the best-converting source and the most-leaky stage."},{"day":225,"name":"Gentle Apology Drafter","pillar":"AI enablement","category":"Writing","status":"Draft","tags":["personal","consultant"],"tools":["Claude","Notion AI"],"description":"Drafts a genuine apology message for a missed commitment.","prompt":"Given a missed commitment (meeting, deliverable, reply), draft an apology: own it without over-explaining, name impact, propose specific fix, end with one warm line. Under 80 words. UK English."},{"day":226,"name":"Meeting Pre-read Generator","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["consultant","founder"],"tools":["Notion AI","Claude"],"description":"Generates a 1-page pre-read for a meeting from related docs.","prompt":"Before a meeting, pull the latest related project page, last meeting notes, and key threads. Generate a 1-page pre-read: context, key decisions needed, open questions, who's bringing what."},{"day":227,"name":"Customer Churn Predictor","pillar":"Analytics","category":"CRM","status":"Draft","tags":["founder","ops"],"tools":["Notion DB","Claude"],"description":"Predicts customers at risk of churn from product signals.","prompt":"Weekly, score each customer on churn risk using: login frequency drop, support tickets, NPS, days since last value moment. Output top 10 at-risk with one save-action each."},{"day":228,"name":"Bedtime Wind-down Coach","pillar":"Life","category":"Health","status":"Draft","tags":["personal"],"tools":["Notion AI"],"description":"Guides a 30-min wind-down before bed.","prompt":"At 22:00, prompt the wind-down: dim screens, brush teeth, last du'a, one page of a book, lights out by 22:30. Skip prompts if already in bed. No screens after 22:15."},{"day":229,"name":"Article Outliner from Notes","pillar":"AI enablement","category":"Writing","status":"Draft","tags":["journalist","creator"],"tools":["Claude","Notion AI"],"description":"Turns a mess of notes into a clean article outline.","prompt":"Given a mess of notes on a topic, produce an outline: hook, thesis, 3-5 sections each with a sub-claim, and a closing. Note where evidence/quotes are missing. UK English."},{"day":230,"name":"Notion Template Picker","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["consultant"],"tools":["Notion AI"],"description":"Suggests a Notion template given a use case.","prompt":"Given a use case (e.g. 'tracking client deliverables'), suggest 3 template directions: layout, key properties, default views, automations to consider. Skip generic suggestions; tailor to context."},{"day":231,"name":"Sponsor Outreach Drafter","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator"],"tools":["Claude","Notion AI"],"description":"Drafts a sponsor outreach pitch with audience stats.","prompt":"Given a target sponsor brand and a fit angle, draft a 250-word pitch: audience stats, why fit, package options (3 tiers), past partner highlight, soft close. UK English, calm."},{"day":232,"name":"Daily Brief Newsletter","pillar":"Automation","category":"Admin","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion Calendar","WhatsApp"],"description":"Sends a personal daily brief at 06:30.","prompt":"Each morning at 06:30, send a personal daily brief: weather, calendar (3 lines), top 3 tasks, one quote, one verse. Keep it under 200 words. UK English, calm tone."},{"day":233,"name":"Workshop Lead Drip","pillar":"Automation","category":"Content","status":"Draft","tags":["creator","consultant"],"tools":["Zapier","Gmail"],"description":"Drips workshop content to registrants pre and post event.","prompt":"When someone registers for a workshop, send: confirmation + calendar invite, 24h before reminder with pre-read, 1h before joining link, post-event recording + slides, Day 7 application question."},{"day":234,"name":"Voice Memo to Notion","pillar":"Automation","category":"Inbox","status":"Draft","tags":["personal","creator"],"tools":["Claude","Zapier","Notion DB"],"description":"Transcribes voice memos and files them into the right inbox.","prompt":"When a voice memo is recorded, transcribe it. Detect type: idea, task, journal entry, meeting note. Route to the right inbox in Notion. Include both transcript and audio link."},{"day":235,"name":"Charity Donation Tracker","pillar":"Life","category":"Finance","status":"Draft","tags":["personal"],"tools":["Notion DB","Google Sheets"],"description":"Tracks zakat and sadaqah throughout the year.","prompt":"Track donations by category (zakat, sadaqah, kaffarah). Quarterly summary by recipient and cause. End of Ramadan year, output zakat calculation worksheet and total given."},{"day":236,"name":"Repeat Client Forecaster","pillar":"Analytics","category":"CRM","status":"Draft","tags":["consultant","founder"],"tools":["Notion DB","Claude"],"description":"Forecasts repeat client revenue for next 6 months.","prompt":"From past client patterns, forecast which clients are likely to return in the next 6 months and at what scope. Show base case, optimistic, pessimistic. Note which assumptions matter most."},{"day":237,"name":"Tafsir Companion","pillar":"AI enablement","category":"Faith","status":"Draft","tags":["personal"],"tools":["Claude"],"description":"Provides classical commentary on a chosen ayah on request.","prompt":"Given an ayah, summarise commentary from Ibn Kathir, Qurtubi, and Sa'di in 4-6 lines each. Note where they differ. Cite sources. UK English, respectful."},{"day":238,"name":"Linear-to-Notion Sync","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops"],"tools":["Linear","Notion DB","Zapier"],"description":"Syncs Linear issue status into a Notion projects DB.","prompt":"Every 30 mins, sync Linear issue status, assignee, and labels to corresponding rows in the Notion Projects DB. Never overwrite human-edited fields in Notion. Log conflicts to a sync audit DB."},{"day":239,"name":"Personal CRM Reminder","pillar":"Automation","category":"Family","status":"Draft","tags":["personal"],"tools":["Notion DB","Claude"],"description":"Reminds to reach out to friends not contacted in 90 days.","prompt":"Monthly, scan personal contacts marked 'keep in touch'. Surface those not contacted in 90+ days. Suggest one warm opener referencing past convo. Never send automatically."},{"day":240,"name":"Slack Sentiment Watcher","pillar":"Analytics","category":"Client Ops","status":"Draft","tags":["founder","ops"],"tools":["Slack","Claude"],"description":"Detects team sentiment shifts in Slack and flags quietly.","prompt":"Weekly, sample recent team Slack messages. Detect sentiment shift vs rolling baseline. If negative shift exceeds threshold, send a quiet DM to me with patterns observed; never to the team."},{"day":241,"name":"AI Skill Onboarding Tutor","pillar":"AI enablement","category":"Learning","status":"Draft","tags":["consultant","ops"],"tools":["Notion AI","Notion DB"],"description":"Onboards new team members to the AI skills library.","prompt":"On Day 1 of a new hire, walk them through the AI skill library: how it's organised, top 5 skills to learn first, how to suggest a new skill, the review process. End with a 'try this one' suggestion."},{"day":242,"name":"Holiday Schedule Bot","pillar":"Automation","category":"Admin","status":"Draft","tags":["personal","ops"],"tools":["Notion Calendar","Google Calendar","Zapier"],"description":"Auto-blocks calendars for public holidays + religious dates.","prompt":"On the 1st of January, populate the calendar with public holidays for Singapore + religious dates (Eid, Ramadan start, Hajj, Ashura). Set as OOO blocks. Notify family/team 7 days before each."},{"day":243,"name":"Pitch Deck Reviewer","pillar":"AI enablement","category":"Content","status":"Draft","tags":["founder","consultant"],"tools":["Claude","Notion AI"],"description":"Reviews a pitch deck for narrative and slide-by-slide clarity.","prompt":"Given a deck, review: narrative arc, slide-level clarity, missing slides (e.g. ask, traction), data credibility, design hierarchy. Score each slide and give 3 prioritised edits. UK English."},{"day":244,"name":"Lead Magnet Idea Generator","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator","founder"],"tools":["Claude","Notion AI"],"description":"Generates lead magnet ideas tailored to an audience pain.","prompt":"Given an audience and a specific pain, brainstorm 8 lead magnet ideas across formats: checklist, swipe file, mini-course, template, calculator, audit. Rate each by effort vs lead quality."},{"day":245,"name":"Kid Reading Tracker","pillar":"Life","category":"Family","status":"Draft","tags":["parent"],"tools":["Notion DB","Claude"],"description":"Tracks child's reading and suggests next books.","prompt":"Track each book read by the child, age-appropriateness, and what they liked. Monthly, suggest 3 next books matched to taste and reading level. Mix fiction, biography, faith stories."},{"day":246,"name":"Knowledge Gap Identifier","pillar":"Analytics","category":"Learning","status":"Draft","tags":["personal","consultant"],"tools":["Notion DB","Claude"],"description":"Identifies knowledge gaps from question history.","prompt":"Quarterly, scan questions asked of AI tools by topic. Identify topics where similar questions keep recurring — that's a real gap. Suggest 3 learning resources to close each gap."},{"day":247,"name":"Property Manager Bot","pillar":"Automation","category":"Household","status":"Draft","tags":["personal"],"tools":["Notion DB","Gmail","Zapier"],"description":"Tracks rental property tasks, maintenance, and tenant comms.","prompt":"Track property tasks: maintenance schedule, tenant requests, payment reminders. When a tenant raises an issue, log it, suggest a contractor from past use, and draft a calm reply."},{"day":248,"name":"Reverse Engineering Reader","pillar":"AI enablement","category":"Writing","status":"Draft","tags":["creator","journalist"],"tools":["Claude","Notion AI"],"description":"Reverse-engineers a great article to extract its craft.","prompt":"Given a great article URL, break down its craft: hook style, structure, transitions, paragraph length pattern, sentence rhythm, voice signature, ending technique. One page of teardown."},{"day":249,"name":"Slack Channel Janitor","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops"],"tools":["Slack","Claude"],"description":"Archives idle channels and suggests channel consolidation.","prompt":"Quarterly, find Slack channels with no messages in 60 days. Suggest archive. Detect overlapping channels by topic and propose merges. Always require human approval before action."},{"day":250,"name":"Habit Score Dashboard","pillar":"Analytics","category":"Health","status":"Draft","tags":["personal"],"tools":["Notion DB","Google Sheets"],"description":"Maintains a weekly habit score dashboard across key domains.","prompt":"Compile weekly habit scores: faith (salah on time), health (sleep + training), work (deep work hours), family (1:1 dinners), learning (reading pages). Output a dashboard with trend lines and one nudge."},{"day":251,"name":"Newsletter Issue Brainstormer","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator"],"tools":["Claude","Notion AI"],"description":"Brainstorms 5 issue ideas based on recent reads and conversations.","prompt":"Each Friday, scan saves, highlights, and high-signal conversations from the week. Generate 5 newsletter issue ideas: working title, hook, 3 sub-points, expected reader takeaway. UK English."},{"day":252,"name":"Spreadsheet to Notion Importer","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops","consultant"],"tools":["Google Sheets","Notion DB","Zapier"],"description":"Imports a structured spreadsheet into a Notion DB safely.","prompt":"Given a Google Sheet URL, infer column types, propose a Notion schema, preview the first 10 rows, then import on confirmation. Log column mismatches and unparseable cells separately."},{"day":253,"name":"Date Night Planner","pillar":"Life","category":"Family","status":"Draft","tags":["personal"],"tools":["Notion AI"],"description":"Plans a fortnightly date night for the couple.","prompt":"Every other Wednesday, suggest a date night for Friday: 3 options (cosy at home, casual out, special). Match to budget and past favourites. Include logistics: babysitter, food, finishing time."},{"day":254,"name":"Article Voice Match Checker","pillar":"AI enablement","category":"Writing","status":"Draft","tags":["creator","journalist"],"tools":["Claude","Notion AI"],"description":"Checks whether a draft sounds like Nasri's voice.","prompt":"Given a draft, compare against a corpus of past Nasri-authored pieces. Score voice match. Flag passages that sound like ChatGPT defaults. Suggest concrete edits to bring it back to voice."},{"day":255,"name":"Client Renewal Scheduler","pillar":"Automation","category":"Client Ops","status":"Draft","tags":["consultant","ops"],"tools":["Notion DB","Notion Calendar","Zapier"],"description":"Schedules a renewal conversation 60 days before contract end.","prompt":"60 days before any client contract ends, schedule a renewal conversation. Draft a brief: project highlights, NPS signal, scope ideas for next term, pricing options. Send invite with the brief attached."},{"day":256,"name":"Wikilink Builder","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["consultant"],"tools":["Notion AI","Notion DB"],"description":"Adds wiki-style backlinks to a Notion page.","prompt":"Given a Notion page, find references to other pages/entities (people, projects, concepts) and add wiki-style backlinks. Never link the same phrase more than once per page. Show diff before applying."},{"day":257,"name":"Mood Journal Companion","pillar":"Life","category":"Health","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion DB"],"description":"Logs a daily mood with a one-line context and patterns.","prompt":"Each evening, ask: 1-line mood word, 1-line context. Save to journal. Weekly, surface mood patterns vs sleep, training, meeting load. Never diagnose; gently suggest one input to tweak."},{"day":258,"name":"Sales Win Loss Analyser","pillar":"Analytics","category":"CRM","status":"Draft","tags":["founder","ops"],"tools":["Notion DB","Claude"],"description":"Analyses recent wins and losses for patterns.","prompt":"Monthly, take last 30 days of closed deals (won + lost). Look for patterns: industry, deal size, lead source, sales cycle length, common objections. Output 3 takeaways and one experiment to run."},{"day":259,"name":"GitHub Repo Health Reporter","pillar":"Analytics","category":"Admin","status":"Draft","tags":["ops"],"tools":["GitHub","Claude"],"description":"Reports repo health: PR velocity, stale branches, test coverage.","prompt":"Weekly, report for each repo: PR merged count, average time-to-merge, stale branches (no commit in 30 days), test coverage delta. Flag any metric in the bottom quartile of the rolling 12-week."},{"day":260,"name":"Pre-meeting Reminder Bot","pillar":"Automation","category":"Admin","status":"Draft","tags":["consultant","founder"],"tools":["Notion Calendar","Notion AI"],"description":"Sends a 10-min pre-meeting brief with last-minute prep.","prompt":"10 minutes before each meeting, send a brief: attendees with last touchpoint, meeting purpose, top 3 talking points, latest related update. Plus a 1-line 'show up calm' reminder."},{"day":261,"name":"Asana Project Sync","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops","consultant"],"tools":["Notion DB","Zapier"],"description":"Mirrors Asana project status into a Notion projects DB.","prompt":"Every 30 mins, sync Asana project state, milestone progress, and assignees into Notion. Surface a change-log entry for any status flip. Never overwrite Notion-only fields."},{"day":262,"name":"Hadith of the Day","pillar":"Life","category":"Faith","status":"Draft","tags":["personal"],"tools":["Claude","WhatsApp"],"description":"Sends a short authentic hadith each morning.","prompt":"Each morning at 06:45, send a short authentic hadith with reference (Bukhari, Muslim, etc), translation, and one line on context. Skip if used in past 60 days. UK English."},{"day":263,"name":"Slack DM Snooze Filter","pillar":"Automation","category":"Inbox","status":"Draft","tags":["personal","consultant"],"tools":["Slack","Zapier"],"description":"Snoozes non-urgent Slack DMs for focused time.","prompt":"During defined focus windows, snooze non-urgent Slack DMs. Detect urgency by sender (VIP list), keywords ('urgent', 'now', client name), or thread heat. Surface snoozed at end of focus block."},{"day":264,"name":"Course Lesson Outliner","pillar":"AI enablement","category":"Learning","status":"Draft","tags":["creator","consultant"],"tools":["Claude","Notion AI"],"description":"Outlines a single course lesson with outcome and exercises.","prompt":"Given a course module and a lesson topic, outline: learning outcome (1 sentence), 3 key teaching points, 1 example, 1 exercise, 1 summary line, recommended length. UK English."},{"day":265,"name":"Refund Request Drafter","pillar":"AI enablement","category":"Client Ops","status":"Draft","tags":["founder","ops"],"tools":["Claude","Gmail"],"description":"Drafts a calm response to a refund request.","prompt":"Given a refund request, draft a calm, fair response: acknowledge specifically what didn't land, confirm or counter the request per policy, propose a path forward (refund / credit / fix). UK English."},{"day":266,"name":"Notion Page Auto-tagger","pillar":"Automation","category":"Admin","status":"Draft","tags":["consultant","creator"],"tools":["Notion AI","Notion DB"],"description":"Auto-tags new pages by content theme.","prompt":"When a new page is created in selected DBs, read the content and apply theme tags from a controlled vocabulary. Never invent new tags; if no fit, leave untagged and log for review."},{"day":267,"name":"Personal Finance Snapshot","pillar":"Analytics","category":"Finance","status":"Draft","tags":["personal"],"tools":["Notion DB","Google Sheets"],"description":"Surfaces a 1-page personal finance snapshot weekly.","prompt":"Each Sunday, compile: cash on hand, this month spend vs budget, savings rate YTD, top 3 expenses this week, upcoming bills next 14 days. One short summary line at the top."},{"day":268,"name":"Source Quote Finder","pillar":"AI enablement","category":"Research","status":"Draft","tags":["journalist","creator"],"tools":["Claude"],"description":"Finds the original source for a quote going around the internet.","prompt":"Given a quote, search for the earliest verifiable source. Note attribution accuracy (often misattributed). Return: original source, year, full context, and a confidence rating."},{"day":269,"name":"House Chore Rotation Bot","pillar":"Automation","category":"Household","status":"Draft","tags":["parent","personal"],"tools":["WhatsApp","Notion DB"],"description":"Rotates household chores fairly across the family.","prompt":"Each Sunday, generate the week's chore rota: who does dishes, laundry, bins, kids' baths each night. Rotate fairly. Account for who's traveling or unwell. Post to family chat."},{"day":270,"name":"Editorial Calendar Filler","pillar":"Automation","category":"Content","status":"Draft","tags":["creator"],"tools":["Notion DB","Claude"],"description":"Fills the editorial calendar 6 weeks out with concrete posts.","prompt":"Each Monday, ensure the editorial calendar has concrete posts assigned 6 weeks out. Fill gaps with ideas from the idea bank. Balance themes. Flag any week looking thin."},{"day":271,"name":"Client Slack Onboarder","pillar":"Automation","category":"Client Ops","status":"Draft","tags":["consultant","ops"],"tools":["Slack","Zapier"],"description":"Sets up a fresh Slack Connect channel for each new client.","prompt":"When a new client signs, create a Slack Connect channel with naming convention 'client-XYZ'. Invite agreed members. Post a welcome message with kickoff link, point-of-contact, and how-we-work."},{"day":272,"name":"Notion Agent Logger","pillar":"Analytics","category":"Admin","status":"Draft","tags":["ops"],"tools":["Notion DB","Webhooks"],"description":"Logs every custom agent's run with input, output, latency.","prompt":"For each agent run, capture: input summary, output summary, latency, tools used, cost estimate. Save to an Agent Logs DB. Surface weekly: top 5 most used, top 5 highest cost, top 5 errors."},{"day":273,"name":"Birthday Card Drafter","pillar":"AI enablement","category":"Family","status":"Draft","tags":["personal"],"tools":["Claude","Notion DB"],"description":"Drafts a personal birthday message for a contact.","prompt":"Given a contact, draft a personal birthday message: reference a shared memory or recent context, warm but not over-the-top, one line of du'a or wish. Under 60 words. UK English."},{"day":274,"name":"Article Performance Reporter","pillar":"Analytics","category":"Content","status":"Draft","tags":["creator","journalist"],"tools":["Zapier","Claude"],"description":"Reports each article's performance 30 days post-publish.","prompt":"30 days after publishing, pull article stats: views, read time, scroll depth, conversions to newsletter, social shares. Compare to past articles. Note what likely drove the result."},{"day":275,"name":"Notion Mention Replier","pillar":"AI enablement","category":"Inbox","status":"Draft","tags":["consultant","ops"],"tools":["Notion AI","Claude"],"description":"Drafts a reply when mentioned on a Notion page.","prompt":"When mentioned on a Notion page, draft a reply: read the page context, the discussion thread, and any linked docs. Suggest a concise response. UK English. Stage for review before posting."},{"day":276,"name":"Quote Card Designer Brief","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator"],"tools":["Claude","Notion AI"],"description":"Writes a creative brief for a quote graphic for the brand.","prompt":"Given a quote, write a design brief: layout direction, typography pairing, palette suggestion (within brand), 1:1 + 9:16 versions, alt text. Hand off to a designer or design tool."},{"day":277,"name":"Email Unsubscribe Helper","pillar":"Analytics","category":"Inbox","status":"Draft","tags":["personal"],"tools":["Gmail","Claude"],"description":"Surfaces lowest-value newsletter subscriptions to consider unsubscribing.","prompt":"Monthly, look at newsletters received in the last 30 days. Score each by open rate, action taken, time since last read. Surface the bottom 5; ask whether to unsubscribe or keep."},{"day":278,"name":"Recurring Bill Watcher","pillar":"Analytics","category":"Finance","status":"Draft","tags":["personal","ops"],"tools":["Notion DB","Google Sheets"],"description":"Flags any recurring bill that jumped vs last month.","prompt":"Monthly, compare each recurring bill to the prior 3 months. Flag any bill that jumped over 15% or appeared for the first time. Show vendor, amount, change, and suggested action."},{"day":279,"name":"Slack Decision Logger","pillar":"Automation","category":"Client Ops","status":"Draft","tags":["ops","founder"],"tools":["Slack","Notion DB","Claude"],"description":"Extracts decisions from Slack threads and logs them.","prompt":"Daily, scan recent Slack threads. Detect decisions made ('agreed', 'let's go with', 'decided'). Extract: decision, owner, date, context link. Save to a Decisions DB. Notify owner."},{"day":280,"name":"Friday Reflection Prompter","pillar":"Life","category":"Health","status":"Draft","tags":["personal"],"tools":["Notion AI","WhatsApp"],"description":"Sends a 5-minute reflection prompt each Friday evening.","prompt":"Each Friday at 17:30, send a reflection prompt: 1 line about what you learned, 1 line about what you'd repeat, 1 line about what you'd drop. Saved to journal with the week tag."},{"day":281,"name":"Project Risk Register","pillar":"Analytics","category":"Client Ops","status":"Draft","tags":["consultant","founder"],"tools":["Notion DB","Claude"],"description":"Maintains a live risk register for each active project.","prompt":"Weekly, for each active project, scan meeting notes + Slack + comments for new risks. Add to risk register with: description, likelihood, impact, owner, mitigation. Flag any high/high to founder."},{"day":282,"name":"Du'a Companion","pillar":"Life","category":"Faith","status":"Draft","tags":["personal"],"tools":["Claude"],"description":"Suggests an authentic du'a for a given situation.","prompt":"Given a situation (travel, anxiety, before sleep, after salah, etc), share 1-2 authentic du'a with Arabic, transliteration, translation, and source (Bukhari, Muslim, Ibn Majah). UK English."},{"day":283,"name":"Hiring Pipeline Tracker","pillar":"Automation","category":"CRM","status":"Draft","tags":["founder","ops"],"tools":["Notion DB","Gmail"],"description":"Tracks candidates and stages for open roles.","prompt":"For each open role, maintain pipeline by stage. When a stage moves, log it with date and reason. Weekly digest: number at each stage, time-in-stage, anyone stuck > 7 days."},{"day":284,"name":"Long-form Article Drafter","pillar":"AI enablement","category":"Writing","status":"Draft","tags":["journalist","creator"],"tools":["Claude","Notion AI"],"description":"Drafts a 1500-word essay from outline + research notes.","prompt":"Given an outline + research notes, draft a 1500-word essay in Nasri's voice: tight intro, evidence-led sections, one strong example per section, calm close. UK English. Include placeholder citations."},{"day":285,"name":"Kid Allowance Tracker","pillar":"Life","category":"Family","status":"Draft","tags":["parent"],"tools":["Notion DB"],"description":"Tracks kid's allowance, chores, and savings goals.","prompt":"Track weekly allowance, chores completed, and savings goal progress. End of week, generate a 1-line summary for the child: earned, spent, saved. Celebrate hitting milestones gently."},{"day":286,"name":"Linear Cycle Planner","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["founder","ops"],"tools":["Linear","Claude"],"description":"Suggests Linear cycle plan based on capacity and priority.","prompt":"Before each cycle, suggest a plan: account for team capacity (PTO, focus blocks), priority labels, and rollover from last cycle. Surface any cycle that's overloaded or under-scoped."},{"day":287,"name":"Calendar Conflict Detector","pillar":"Automation","category":"Admin","status":"Draft","tags":["personal","consultant"],"tools":["Notion Calendar","Google Calendar"],"description":"Detects double-bookings and scheduling conflicts proactively.","prompt":"Every hour, scan calendar for next 7 days. Flag any double-bookings, back-to-back meetings without buffer, or meetings during defined focus blocks. Suggest one fix per conflict."},{"day":288,"name":"Reading List Pruner","pillar":"Analytics","category":"Learning","status":"Draft","tags":["personal","consultant"],"tools":["Notion DB","Claude"],"description":"Suggests articles to archive from a bloated reading list.","prompt":"Monthly, look at the reading list. For items saved over 90 days ago and never opened, suggest archiving with a one-line reason ('topic moved on', 'duplicates X you've read')."},{"day":289,"name":"Project Kickoff Bot","pillar":"AI enablement","category":"Client Ops","status":"Draft","tags":["consultant","founder"],"tools":["Notion AI","Claude"],"description":"Generates kickoff doc + first 2 weeks plan for a new project.","prompt":"Given a new project brief, generate: kickoff doc (problem, goals, scope, success metrics, risks), first 2 weeks plan with milestones, and a stakeholder map. UK English."},{"day":290,"name":"Article Title Tester","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator","journalist"],"tools":["Claude","Notion AI"],"description":"Generates 8 title variants and scores them.","prompt":"Given an article draft, generate 8 title variants across styles: descriptive, curiosity, contrarian, listicle, question. Score each on clarity, intrigue, search-friendliness. Recommend top 2."},{"day":291,"name":"Family Photo Album Curator","pillar":"Life","category":"Family","status":"Draft","tags":["parent","personal"],"tools":["Zapier","Claude"],"description":"Curates monthly family photo album from camera roll.","prompt":"End of each month, scan camera roll. Select 20-30 best photos: variety of people, scenes, expressions. Avoid near-duplicates. Auto-create album titled with the month and key event."},{"day":292,"name":"MCP Tool Inventory","pillar":"Analytics","category":"Admin","status":"Draft","tags":["ops"],"tools":["MCP","Notion DB"],"description":"Inventories every MCP tool connected, with usage stats.","prompt":"Weekly, list every MCP server connected, the tools each exposes, and usage count over last 7 days. Flag unused tools (could be retired) and overused tools (might need rate limits)."},{"day":293,"name":"Vendor Renewal Watcher","pillar":"Automation","category":"Finance","status":"Draft","tags":["founder","ops"],"tools":["Notion DB","Gmail","Zapier"],"description":"Flags SaaS renewals 30 days out with usage stats.","prompt":"30 days before any SaaS renewal, surface: cost, last 90 days usage, seat utilisation, alternative tools, recommend renew/negotiate/downgrade/cancel. Send to me for review."},{"day":294,"name":"Notion Comment Resolver","pillar":"Automation","category":"Inbox","status":"Draft","tags":["consultant","ops"],"tools":["Notion AI","Notion DB"],"description":"Reminds to resolve unaddressed Notion comments.","prompt":"Weekly, find all open Notion comments mentioning me or my team. Surface the page, the comment, and how stale (days open). Suggest priority order: client > internal > nice-to-have."},{"day":295,"name":"Slack Thread Summariser","pillar":"AI enablement","category":"Inbox","status":"Draft","tags":["consultant","ops"],"tools":["Slack","Claude"],"description":"Summarises a long Slack thread on request.","prompt":"Given a Slack thread link, output: 3-line summary, key decisions, open questions, action items with owners. Note dissenting opinions if any. UK English."},{"day":296,"name":"Workshop Pitch Composer","pillar":"AI enablement","category":"Content","status":"Draft","tags":["consultant","creator"],"tools":["Claude","Notion AI"],"description":"Composes a tailored workshop pitch for a corporate buyer.","prompt":"Given a corporate buyer, target outcome, and audience size, compose a workshop pitch: title, outcomes, agenda, format options, pricing, deliverables, social proof. UK English, evidence-led."},{"day":297,"name":"Health Lab Trend Reporter","pillar":"Analytics","category":"Health","status":"Draft","tags":["personal"],"tools":["Notion DB","Claude"],"description":"Tracks lab results over time and surfaces trends.","prompt":"When a new lab report is added, parse markers (lipids, glucose, vitamins). Compare to past results. Flag any marker trending outside healthy range. Suggest 1 lifestyle nudge per flag, never diagnose."},{"day":298,"name":"Gmail VIP Surfacer","pillar":"Automation","category":"Inbox","status":"Draft","tags":["personal","consultant"],"tools":["Gmail","Claude"],"description":"Surfaces VIP emails into a daily must-reply digest.","prompt":"Each morning, surface emails from VIP senders (client decision-makers, family, finance) needing reply. One digest, ranked by oldest unreplied. Skip newsletters and auto-emails."},{"day":299,"name":"Quarterly Theme Setter","pillar":"AI enablement","category":"Learning","status":"Draft","tags":["personal","founder"],"tools":["Claude","Notion AI"],"description":"Helps define one theme per quarter with measurable signals.","prompt":"At the start of each quarter, suggest one theme (e.g. 'compounding'). Define: what it looks like in work, family, faith, health. Define 1 leading signal per area to track."},{"day":300,"name":"Client Quarterly Review Pack","pillar":"AI enablement","category":"Client Ops","status":"Draft","tags":["consultant"],"tools":["Notion AI","Claude","Notion DB"],"description":"Builds a quarterly business review pack for each retainer client.","prompt":"End of each quarter, build a QBR pack per retainer client: work delivered, outcomes, metrics moved, what's next, scope adjustments. Slides + one-page summary. UK English."},{"day":301,"name":"Inbox Zero Coach","pillar":"Automation","category":"Inbox","status":"Draft","tags":["personal","consultant"],"tools":["Gmail","Claude"],"description":"Guides a 20-min inbox zero session.","prompt":"On request, run a 20-min inbox zero session: triage oldest unread first, suggest reply/archive/snooze/delegate for each. Draft replies for those needing one. Stop after 20 mins regardless."},{"day":302,"name":"Newsletter Subject Line Tester","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator"],"tools":["Claude","Notion AI"],"description":"Generates and ranks newsletter subject lines.","prompt":"Given a newsletter draft, generate 10 subject line variants across styles. Score by open-likelihood, clarity, and brand-fit. Recommend top 2 and one bold experiment. UK English."},{"day":303,"name":"Family Meal Photo Logger","pillar":"Life","category":"Health","status":"Draft","tags":["parent","personal"],"tools":["Claude","Notion DB"],"description":"Logs family meals and dietary balance over the week.","prompt":"Take a photo of meals shared as a family. Detect dishes, estimate balance (protein, fibre, veg, carbs). Weekly digest with one nudge to add variety, never to restrict."},{"day":304,"name":"Notion DB Schema Auditor","pillar":"Analytics","category":"Admin","status":"Draft","tags":["consultant","ops"],"tools":["Notion DB","Claude"],"description":"Audits database schemas for cleanliness and consistency.","prompt":"Monthly, audit each DB schema: orphan properties, inconsistent naming (Title vs Name), duplicate select options, unused views. Output a clean-up list with quick wins first."},{"day":305,"name":"Lecture Notes Curator","pillar":"AI enablement","category":"Learning","status":"Draft","tags":["personal"],"tools":["Claude"],"description":"Curates lecture notes from a YouTube talk on request.","prompt":"Given a YouTube talk URL, fetch the transcript. Output structured notes: speaker thesis, key arguments, evidence cited, your questions, suggested follow-up reading. UK English."},{"day":306,"name":"Client NPS Pulse","pillar":"Automation","category":"Client Ops","status":"Draft","tags":["consultant","ops"],"tools":["Gmail","Notion DB","Zapier"],"description":"Sends a quarterly NPS pulse to clients.","prompt":"Each quarter, send a short NPS pulse to each active client: 1 score question + 1 open question. Compile responses, calculate NPS, surface verbatim themes and any detractor for follow-up."},{"day":307,"name":"PR Outreach Pitcher","pillar":"AI enablement","category":"Content","status":"Draft","tags":["founder","creator"],"tools":["Claude","Gmail"],"description":"Drafts a PR pitch to a journalist for a specific story angle.","prompt":"Given a journalist's beat and a story angle, draft a 90-word PR pitch: clear hook, why now, what's unique, your one-line credential, offered next step. UK English, no fluff."},{"day":308,"name":"Notion Page Migrator","pillar":"Automation","category":"Admin","status":"Draft","tags":["consultant","ops"],"tools":["Notion AI","Notion DB"],"description":"Migrates a page (and children) to a new parent safely.","prompt":"Given a source page and a target parent, migrate the page and its children. Preserve content, comments, properties. Pre-flight: list any broken links or external refs to fix. Confirm before action."},{"day":309,"name":"Workout Plan Adjuster","pillar":"Life","category":"Health","status":"Draft","tags":["personal"],"tools":["Notion DB","Claude"],"description":"Adjusts the week's workouts based on yesterday's recovery.","prompt":"Each morning, check yesterday's recovery signals (sleep, HRV, soreness logged). Adjust today's workout intensity: green = full, amber = swap to lighter, red = rest. Show why."},{"day":310,"name":"Faith Reminder for Family","pillar":"Automation","category":"Faith","status":"Draft","tags":["parent","personal"],"tools":["WhatsApp","Zapier"],"description":"Sends salah and key faith reminders to the family chat.","prompt":"5 minutes before each prayer time in our city, send a calm reminder to the family chat with the prayer name. On Fridays, send the Jumu'ah reminder + 1 line about its virtue."},{"day":311,"name":"Slack Channel Welcome Bot","pillar":"Automation","category":"Client Ops","status":"Draft","tags":["ops"],"tools":["Slack","Claude"],"description":"Welcomes new members to a Slack channel with a 3-step intro.","prompt":"When a new member joins #team, DM them a welcome: how this channel is used, who to ping for what, link to the team wiki. Light tone. Ask one icebreaker question."},{"day":312,"name":"Quote Pull Curator","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator","journalist"],"tools":["Claude","Notion AI"],"description":"Curates 5 quotes from a long-form draft for promotion.","prompt":"Given a long-form draft, pull 5 quote candidates that work standalone: short, surprising, or counter-intuitive. Tag each: hook, summary, contrarian, emotional, evidence. For social use."},{"day":313,"name":"Personal SWOT Reviewer","pillar":"Life","category":"Learning","status":"Draft","tags":["personal","founder"],"tools":["Notion AI","Claude"],"description":"Walks me through a personal SWOT review each quarter.","prompt":"Each quarter, prompt: list 3 strengths, 3 weaknesses, 3 opportunities, 3 threats. For each, ask one follow-up. End with 2 priorities and 1 thing to drop. Saved to journal."},{"day":314,"name":"Lead Disqualifier","pillar":"AI enablement","category":"CRM","status":"Draft","tags":["founder","consultant"],"tools":["Claude","Gmail"],"description":"Politely disqualifies bad-fit inbound leads.","prompt":"When an inbound lead is clearly out of scope (budget, fit, timing), draft a polite disqualification: thank them, name the misfit specifically, suggest an alternative if any, close warmly. UK English."},{"day":315,"name":"GitHub Release Notes Drafter","pillar":"Automation","category":"Content","status":"Draft","tags":["ops"],"tools":["GitHub","Claude"],"description":"Drafts release notes from merged PRs since last tag.","prompt":"On release, pull merged PRs since the last tag. Group into: New, Improved, Fixed. Draft user-facing release notes with one-line summaries (not commit messages). UK English."},{"day":316,"name":"Date Idea Refresher","pillar":"AI enablement","category":"Family","status":"Draft","tags":["personal"],"tools":["Notion DB","Claude"],"description":"Refreshes the date-idea bank when it's low.","prompt":"When the date-idea bank has fewer than 8 unused ideas, suggest 10 new ones tailored to season, recent rotations, and budget tiers. Avoid repeats from last 6 months."},{"day":317,"name":"Daily Standup Compiler","pillar":"Automation","category":"Admin","status":"Draft","tags":["consultant","founder"],"tools":["Notion DB","Slack","Claude"],"description":"Compiles a personal standup at end of day for the team.","prompt":"Each weekday at 17:30, compile a 'done today / doing tomorrow / blocked on' note from completed tasks, calendar, and Slack DMs. Post to #updates. Keep under 60 words."},{"day":318,"name":"Workshop Recap Generator","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator","consultant"],"tools":["Notion AI","Gmail"],"description":"Generates a recap doc post-workshop for attendees.","prompt":"After a workshop, generate a recap: agenda recap, key insights shared, exercises completed, attendee questions answered, recommended next steps, link to recording. Send within 24 hours."},{"day":319,"name":"Voice Note Action Extractor","pillar":"AI enablement","category":"Inbox","status":"Draft","tags":["personal","consultant"],"tools":["Claude","Notion DB"],"description":"Extracts actions from a voice note transcript.","prompt":"Given a voice note transcript, extract: tasks (with implied owner + deadline), ideas (added to idea bank), decisions (logged), questions (need answers). File each into the right Notion DB."},{"day":320,"name":"Annual Family Goals","pillar":"Life","category":"Family","status":"Draft","tags":["parent","personal"],"tools":["Notion AI","Notion DB"],"description":"Helps the family set 3 shared goals for the year.","prompt":"Each January, walk the family through setting 3 shared goals (a trip, a habit, a learning). Capture: goal, why it matters, what counts as done, who leads. Review quarterly."},{"day":321,"name":"Linear Issue Estimator","pillar":"AI enablement","category":"Admin","status":"Draft","tags":["ops","founder"],"tools":["Linear","Claude"],"description":"Estimates Linear issue effort from description and history.","prompt":"Given a new Linear issue, estimate effort (S/M/L/XL) based on description + comparable past issues. Show 3 similar past issues with their actual time. Always conservative; round up when uncertain."},{"day":322,"name":"Expense Receipt OCR","pillar":"Automation","category":"Finance","status":"Draft","tags":["personal","ops"],"tools":["Zapier","Claude","Notion DB"],"description":"OCRs receipt photos and files structured expense entries.","prompt":"When a receipt photo is received, OCR it. Extract: date, vendor, items, amount, tax, payment method. File into the Expenses DB. Flag any field that's low-confidence for manual review."},{"day":323,"name":"Research Note Synthesiser","pillar":"AI enablement","category":"Research","status":"Draft","tags":["journalist","consultant"],"tools":["Claude","Notion AI"],"description":"Synthesises a set of research notes into a position paper.","prompt":"Given a set of research notes on a topic, synthesise into a 1000-word position paper: the question, the state of debate, the strongest case, your position with reasoning, open questions. UK English."},{"day":324,"name":"Notion Template Library Curator","pillar":"Analytics","category":"Admin","status":"Draft","tags":["consultant","ops"],"tools":["Notion DB","Claude"],"description":"Curates internal Notion template library and tracks usage.","prompt":"Track usage of each internal template. Monthly, surface most-used (promote) and least-used (deprecate or improve). When a new use case emerges 3+ times, suggest adding a template."},{"day":325,"name":"Slack Reaction Trend Tracker","pillar":"Analytics","category":"Client Ops","status":"Draft","tags":["ops"],"tools":["Slack","Claude"],"description":"Tracks which Slack reactions are spiking by channel.","prompt":"Weekly, count Slack reactions by emoji per channel. Surface trending reactions (e.g. a sudden spike in :tada: vs :grimacing:) as a soft sentiment signal. Note any outliers worth investigating."},{"day":326,"name":"Friday Khutbah Notes","pillar":"Life","category":"Faith","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion DB"],"description":"Captures Friday khutbah notes and key reminders.","prompt":"After Jumu'ah, prompt for 3 lines: main theme, one verse/hadith cited, one personal takeaway. Save to faith journal with date and khateeb. Quarterly, surface recurring themes."},{"day":327,"name":"Sales Pipeline Forecaster","pillar":"Analytics","category":"CRM","status":"Draft","tags":["founder","ops"],"tools":["Notion DB","Claude"],"description":"Forecasts close revenue for next 60 days from pipeline.","prompt":"Weekly, take open deals weighted by stage probability. Forecast next 60-day close revenue: base/optimistic/pessimistic. Note which 2-3 deals would shift the forecast most."},{"day":328,"name":"Email Threading Cleaner","pillar":"Automation","category":"Inbox","status":"Draft","tags":["personal","consultant"],"tools":["Gmail","Claude"],"description":"Cleans up email replies by stripping quoted bottom-text.","prompt":"On outgoing replies, strip excessive quoted history (keep last reply only). Remove email signatures repeated from prior thread. Show clean preview before send. Skip for legal/finance threads."},{"day":329,"name":"Notion Public Page Auditor","pillar":"Analytics","category":"Admin","status":"Draft","tags":["ops"],"tools":["Notion DB"],"description":"Audits which Notion pages are publicly shared.","prompt":"Monthly, list every Notion page set to 'public to web' or 'anyone with link'. For each: page title, when it was published, who set it. Flag pages that look sensitive for review."},{"day":330,"name":"Family Holiday Countdown","pillar":"Life","category":"Family","status":"Draft","tags":["parent","personal"],"tools":["WhatsApp","Notion AI"],"description":"Counts down to family holidays and preps logistics.","prompt":"30/14/7/1 days before a family holiday, post a countdown to family chat with: weather, packing reminder, one excited line, what's pending in prep. Light, warm tone."},{"day":331,"name":"AI Output Reviewer","pillar":"AI enablement","category":"Writing","status":"Draft","tags":["creator","consultant"],"tools":["Claude"],"description":"Reviews AI-generated drafts for hallucination and tone.","prompt":"Given an AI-generated draft, review for: hallucinated facts, generic ChatGPT phrasing, missing brand voice. Flag specific lines. Suggest a tighter rewrite for any flagged passage."},{"day":332,"name":"Notion Page Owner Reminder","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops"],"tools":["Notion DB","Slack"],"description":"Pings owners on pages that haven't been updated in 90 days.","prompt":"Monthly, scan key DBs. For pages with no edit in 90 days and an owner set, ping owner gently: 'still active?' with options: keep / archive / hand off. Never archive automatically."},{"day":333,"name":"Daily Gratitude Logger","pillar":"Life","category":"Health","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion DB"],"description":"Logs 3 things to be grateful for each night.","prompt":"Each night at 21:30, ask: 3 things to be grateful for today (people, moments, small wins). Save to gratitude journal. Quarterly, surface recurring themes."},{"day":334,"name":"Client Reference Replier","pillar":"AI enablement","category":"CRM","status":"Draft","tags":["consultant"],"tools":["Claude","Gmail"],"description":"Drafts a reply to a client reference request.","prompt":"When asked to be a reference for a past client, draft a positive, specific reply: 2-3 concrete strengths with examples, one honest growth area framed constructively, willingness to talk further. UK English."},{"day":335,"name":"Slack Out-of-Office Manager","pillar":"Automation","category":"Admin","status":"Draft","tags":["personal","ops"],"tools":["Slack","Google Calendar","Zapier"],"description":"Sets and lifts Slack OOO status based on calendar.","prompt":"When a multi-day OOO event is added to the calendar, auto-set Slack status (emoji, message, expiry, DND). Lift on return morning. Auto-reply to DMs during OOO with the return date."},{"day":336,"name":"Newsletter Reader Persona Mapper","pillar":"Analytics","category":"Content","status":"Draft","tags":["creator"],"tools":["Claude","Google Sheets"],"description":"Maps newsletter readers into personas from engagement data.","prompt":"Annually, cluster newsletter readers by engagement (open rate, click pattern, reply rate, topics responded to). Output 3-5 personas with size, signature behaviour, and one content idea per persona."},{"day":337,"name":"Sermon Library Searcher","pillar":"AI enablement","category":"Faith","status":"Draft","tags":["personal"],"tools":["Notion DB","Claude"],"description":"Searches saved sermons by theme or speaker.","prompt":"Given a theme (e.g. 'patience') or a speaker name, search the saved sermon library. Return up to 5 best matches with title, speaker, length, and 2-line summary. Sort by date or relevance."},{"day":338,"name":"Project Update Drafter","pillar":"AI enablement","category":"Client Ops","status":"Draft","tags":["consultant"],"tools":["Notion AI","Gmail","Notion DB"],"description":"Drafts a weekly client project update email.","prompt":"Each Friday, draft a client update email: progress this week, what's next, decisions needed from them, risks/asks, a warm one-liner. UK English, calm. Stage for review before send."},{"day":339,"name":"Book Summary Synthesiser","pillar":"AI enablement","category":"Learning","status":"Draft","tags":["personal","creator"],"tools":["Claude","Notion AI"],"description":"Synthesises a finished book into a 2-page summary.","prompt":"When a book is marked 'finished' in the library, generate: thesis, 3-5 core ideas with examples, 3 of your highlights, 2 disagreements or open questions, who else would benefit from this. UK English."},{"day":340,"name":"GitHub Issue Auto-labeller","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops"],"tools":["GitHub","Claude"],"description":"Auto-labels GitHub issues based on content patterns.","prompt":"On every new GitHub issue, classify by content: bug/feature/question/docs. Apply matching labels. Set priority guess (P0-P3) with one-line rationale. Never auto-assign; leave that to humans."},{"day":341,"name":"Personal Budget Closer","pillar":"Analytics","category":"Finance","status":"Draft","tags":["personal"],"tools":["Notion DB","Google Sheets"],"description":"Closes the personal budget month-end with variance analysis.","prompt":"End of each month, reconcile actual spend vs budget by category. Show variance with 1-line reason where obvious. Roll forward unused buffer. Suggest next month's budget tweaks."},{"day":342,"name":"Lead Magnet Page Builder","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator","founder"],"tools":["Claude","Notion AI"],"description":"Drafts a landing page for a lead magnet.","prompt":"Given a lead magnet + audience + pain, draft a landing page: headline, subhead, 3 benefit bullets, social proof line, form caption, footer du'a. UK English, calm authority."},{"day":343,"name":"Notion Page Backup Bot","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops","consultant"],"tools":["Notion DB","Zapier"],"description":"Backs up critical Notion pages to Google Drive weekly.","prompt":"Weekly, export key Notion pages (client work, contracts, brand assets) as markdown + PDF to a Google Drive backup folder. Rotate: keep weekly for 8 weeks, monthly for 12 months."},{"day":344,"name":"Quranic Reflection Logger","pillar":"Life","category":"Faith","status":"Draft","tags":["personal"],"tools":["Notion AI","Notion DB"],"description":"Captures a daily Quranic reflection in 3 lines.","prompt":"Each evening, prompt: today's ayah/passage read, one line of reflection, one line of action. Save to Quran journal with date and surah. Monthly, surface recurring themes."},{"day":345,"name":"Outreach Cadence Builder","pillar":"AI enablement","category":"CRM","status":"Draft","tags":["founder","consultant"],"tools":["Claude","Gmail"],"description":"Builds a 5-touch outreach cadence for a target persona.","prompt":"Given a target persona and value prop, design a 5-touch outreach cadence over 3 weeks: channel mix, message templates, escalation logic, opt-out friendly. UK English, no hard-sell."},{"day":346,"name":"Slack Channel Topic Setter","pillar":"Automation","category":"Admin","status":"Draft","tags":["ops"],"tools":["Slack","Claude"],"description":"Sets and updates Slack channel topics for clarity.","prompt":"On a schedule (weekly), check key Slack channels. If topic is stale or missing, suggest one based on current sprint/project. Includes: purpose, key links, primary owner. Update with approval."},{"day":347,"name":"Wisdom Quote Captor","pillar":"Life","category":"Learning","status":"Draft","tags":["personal","creator"],"tools":["Notion AI","Notion DB"],"description":"Captures a wisdom quote a day and links to source.","prompt":"Daily, prompt for one wisdom quote you encountered (from a book, talk, conversation). Capture: quote, attribution, source, why it landed. Save to Wisdom DB with tags."},{"day":348,"name":"Notion Page Open Graph Filler","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator"],"tools":["Notion AI"],"description":"Adds page covers and open-graph descriptions to published pages.","prompt":"For pages set to public, ensure each has: a page cover, an icon, a description (used as open graph). Suggest values based on page content. Apply with approval."},{"day":349,"name":"Estate Planning Reminder","pillar":"Life","category":"Finance","status":"Draft","tags":["personal","parent"],"tools":["Notion AI","Notion DB"],"description":"Reminds annually to review estate documents and beneficiaries.","prompt":"Each year on a chosen date, remind to review: will, takaful/insurance beneficiaries, emergency contacts, important account access list, locations of original docs. Provide a short checklist."},{"day":350,"name":"Article Internal Linker","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator","journalist"],"tools":["Claude","Notion AI"],"description":"Suggests internal links between published articles.","prompt":"After publishing a new article, scan existing articles. Suggest 3-5 internal links: where to add the new article into existing pieces, and which existing pieces to link from the new one."},{"day":351,"name":"Calendar Theme Days Setter","pillar":"Automation","category":"Admin","status":"Draft","tags":["personal","consultant"],"tools":["Notion Calendar","Google Calendar"],"description":"Themes weekdays for focus (e.g. Maker Monday, Meeting Tuesday).","prompt":"Set weekday themes: Mon = maker / deep work, Tue = meetings, Wed = mixed, Thu = creative, Fri = admin + reflection. Auto-reject new meetings outside theme. Override with approval."},{"day":352,"name":"Client Testimonial Requestor","pillar":"AI enablement","category":"CRM","status":"Draft","tags":["consultant","founder"],"tools":["Claude","Gmail"],"description":"Requests a testimonial after a client win moment.","prompt":"When a client expresses a specific positive outcome (in Slack, email, or meeting notes), draft a testimonial request: reference the moment, offer 3 short prompts, make it easy to say no. UK English."},{"day":353,"name":"Family Memory Resurfacer","pillar":"Life","category":"Family","status":"Draft","tags":["parent","personal"],"tools":["Zapier","WhatsApp"],"description":"Resurfaces a family memory from this date in past years.","prompt":"Each morning, look for photos and journal entries from the same date in past years. Send a 'on this day' note to the family chat with a photo and a one-line memory."},{"day":354,"name":"Notion Workspace Health Score","pillar":"Analytics","category":"Admin","status":"Draft","tags":["ops","consultant"],"tools":["Notion DB","Claude"],"description":"Generates a monthly workspace health score across signals.","prompt":"Monthly, compile a workspace health score: % active DBs, % stale pages, comment resolution rate, template usage, agent run success rate. Trend vs last 6 months. One improvement suggestion."},{"day":355,"name":"Quranic Memorisation Tracker","pillar":"Life","category":"Faith","status":"Draft","tags":["personal","parent"],"tools":["Notion DB","Claude"],"description":"Tracks Quran memorisation progress with daily review.","prompt":"Track current memorisation: surah, ayah range, date learned. Daily, suggest review schedule (spaced: 1 day, 3 days, 7 days, 21 days). Surface anything weak. Never push hard; gentle."},{"day":356,"name":"Podcast Show Notes Drafter","pillar":"AI enablement","category":"Content","status":"Draft","tags":["creator"],"tools":["Claude","Notion AI"],"description":"Drafts show notes from a podcast episode transcript.","prompt":"Given a podcast transcript, draft show notes: 2-line episode summary, 5 key takeaways, timestamps for highlights, guest bio, links mentioned, suggested follow-up. UK English."},{"day":357,"name":"Investor CRM Updater","pillar":"Automation","category":"CRM","status":"Draft","tags":["founder"],"tools":["Notion DB","Notion Calendar"],"description":"Updates investor CRM after each conversation.","prompt":"After each investor conversation (calendar event tagged 'investor'), prompt for: tone, asks they made, follow-up due. Update investor CRM with notes, next-step, date. Set reminder for follow-up."},{"day":358,"name":"Email Tone Smoother","pillar":"AI enablement","category":"Writing","status":"Draft","tags":["personal","consultant"],"tools":["Claude","Notion AI"],"description":"Smooths the tone of a sharp draft email.","prompt":"Given a draft email that reads sharp or curt, suggest a smoothed version: same content and ask, warmer opener, softer transitions, kept brevity. Preserve any firm points. UK English."},{"day":359,"name":"Household Repair Logger","pillar":"Automation","category":"Household","status":"Draft","tags":["personal","parent"],"tools":["Notion DB","Zapier"],"description":"Logs household repairs and warranty info for retrieval.","prompt":"When a ho
